<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Fight Academy - Controllo Scadenze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- HEADER -->
        <header class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-amber-500 p-3 rounded-2xl text-white shadow-lg">
                    <i class="fa-solid fa-bell text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight uppercase">Controllo Scadenze</h1>
                    <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Monitoraggio Certificati e Tessere ASI</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="eseguiAlert(this)" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-lg flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-paper-plane"></i> Invia Alert
                </button>
                <a href="admin.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </header>

        <!-- TABELLA SCADENZE -->
        <main class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-700 bg-slate-700/30">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-amber-400"></i> Tesserati in Scadenza o Scaduti
                </h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-900/50 text-slate-400 uppercase font-bold border-b border-slate-700">
                        <tr>
                            <th class="p-4">Tesserato / Corso</th>
                            <th class="p-4">Contatti</th>
                            <th class="p-4">Scadenza Medico</th>
                            <th class="p-4">Scadenza ASI</th>
                        </tr>
                    </thead>
                    <tbody id="scadenze-tbody" class="divide-y divide-slate-700/50 text-slate-300">
                        <tr>
                            <td colspan="4" class="p-12 text-center">
                                <i class="fa-solid fa-spinner fa-spin text-2xl text-amber-500 mb-2"></i>
                                <p class="text-slate-500 italic">Recupero dati dal cloud...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Protezione Accesso
        const sessionUser = JSON.parse(localStorage.getItem('asd_admin_user'));
        if (!sessionUser) {
            alert("Accesso negato. Effettua il login.");
            location.href = 'admin.html';
        }

        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getCorsoDisplayFromSocio(socio) {
            const iscrizioni = Array.isArray(socio?.iscrizioni_corsi) ? socio.iscrizioni_corsi : [];
            const latest = iscrizioni.slice().sort((a, b) => new Date(b.data_iscrizione || 0) - new Date(a.data_iscrizione || 0))[0];
            return latest?.nome_corso || 'GENERALE';
        }

        function getCorsiNomiSocio(socio) {
            const iscrizioni = Array.isArray(socio?.iscrizioni_corsi) ? socio.iscrizioni_corsi : [];
            const nomi = iscrizioni.map(i => i.nome_corso).filter(Boolean);
            return nomi.length > 0 ? [...new Set(nomi)] : ['GENERALE'];
        }

        function giorniAllaScadenza(dataScadenza) {
            if (!dataScadenza) return null;
            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);
            const scadenza = new Date(dataScadenza);
            scadenza.setHours(0, 0, 0, 0);
            return Math.round((scadenza - oggi) / (1000 * 60 * 60 * 24));
        }

        async function caricaScadenze() {
            const tbody = document.getElementById('scadenze-tbody');
            
            try {
                const { data, error } = await supabaseClient
                    .from('soci')
                    .select('*');

                if (error) throw error;

                const socioIds = (data || []).map(s => s.id);
                const { data: iscrizioni, error: iscrizioniError } = await supabaseClient
                    .from('iscrizioni_corsi')
                    .select('socio_id, nome_corso, stato, data_iscrizione')
                    .in('socio_id', socioIds);

                if (iscrizioniError) throw iscrizioniError;

                (data || []).forEach(s => {
                    s.iscrizioni_corsi = (iscrizioni || []).filter(i => i.socio_id === s.id);
                    s.giorni_alla_scadenza_medica = giorniAllaScadenza(s.scadenza_certificato_medico);
                    s.giorni_alla_scadenza_asi = giorniAllaScadenza(s.scadenza_tessera_asi);
                });

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-slate-500 italic font-medium">Nessuna scadenza critica rilevata al momento.</td></tr>';
                    return;
                }

                // Solo scadenze critiche: assenti, in scadenza entro 30gg o già scadute.
                const isCritico = (s) => {
                    const gm = s.giorni_alla_scadenza_medica;
                    const ga = s.giorni_alla_scadenza_asi;
                    return gm === null || gm <= 30 || ga === null || ga <= 30;
                };

                // Filtraggio per Istruttore (se non è presidente): deve vedere il tesserato
                // se uno qualsiasi dei suoi corsi rientra tra le competenze dell'istruttore.
                let sociFiltrati = data.filter(isCritico);
                if (sessionUser.ruolo !== 'presidente') {
                    const comp = (sessionUser.corsi_competenze || []).map(c => String(c).toLowerCase().trim());
                    sociFiltrati = sociFiltrati.filter(s => getCorsiNomiSocio(s).some(nome => comp.some(c => nome.toLowerCase().includes(c))));
                }

                if (sociFiltrati.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-slate-500 italic font-medium">Nessun allievo dei tuoi corsi ha scadenze imminenti.</td></tr>';
                    return;
                }


                tbody.innerHTML = sociFiltrati.map(tesserato => {
                    const giorniMed = tesserato.giorni_alla_scadenza_medica;
                    const giorniAsi = tesserato.giorni_alla_scadenza_asi;

                    const medColor = (giorniMed === null || giorniMed === undefined)
                        ? 'text-red-500'
                        : (giorniMed <= 0 ? 'text-red-500' : (giorniMed <= 30 ? 'text-amber-400' : 'text-slate-300'));

                    const asiColor = (giorniAsi === null || giorniAsi === undefined)
                        ? 'text-red-500'
                        : (giorniAsi <= 0 ? 'text-red-500' : (giorniAsi <= 30 ? 'text-amber-400' : 'text-slate-300'));

                    const medLabel = (giorniMed === null || giorniMed === undefined)
                        ? 'DATA ASSENTE'
                        : (giorniMed <= 0 ? `${Math.abs(giorniMed)} GIORNI SCADUTI` : `${giorniMed} GIORNI RIMANENTI`);

                    const asiLabel = (giorniAsi === null || giorniAsi === undefined)
                        ? 'DATA ASSENTE'
                        : (giorniAsi <= 0 ? `${Math.abs(giorniAsi)} GIORNI SCADUTI` : `${giorniAsi} GIORNI RIMANENTI`);

                    const corsiNomi = getCorsiNomiSocio(tesserato);
                    const corsiBadge = corsiNomi.map(nome => `<span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-900 text-slate-400 font-mono border border-slate-700 uppercase tracking-tighter">${nome}</span>`).join(' ');
                    return `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="p-4">
                                <p class="font-bold text-white text-sm uppercase">${tesserato.nome || ''} ${tesserato.cognome || ''}</p>
                                <div class="flex flex-wrap gap-1 mt-1">
                                    ${corsiBadge}
                                </div>
                            </td>
                            <td class="p-4">
                                <p class="text-[10px] text-slate-400 tracking-tight"><i class="fa-solid fa-envelope mr-1 text-slate-600"></i>${tesserato.email || ''}</p>
                                <p class="text-[10px] text-slate-400 tracking-tight"><i class="fa-solid fa-phone mr-1 text-slate-600"></i>${tesserato.telefono || '---'}</p>
                            </td>
                            <td class="p-4">
                                <div class="${medColor} font-bold">
                                    ${tesserato.scadenza_certificato_medico || 'N/D'}
                                </div>
                                <div class="text-[9px] opacity-60 uppercase font-bold tracking-tighter ${medColor}">
                                    ${medLabel}
                                </div>
                            </td>
                            <td class="p-4">
                                <div class="${asiColor} font-bold">
                                    ${tesserato.scadenza_tessera_asi || 'N/D'}
                                </div>
                                <div class="text-[9px] opacity-60 uppercase font-bold tracking-tighter ${asiColor}">
                                    ${asiLabel}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="4" class="p-12 text-center text-red-400 font-bold uppercase tracking-widest text-[10px]">Errore caricamento dati: ${err.message}</td></tr>`;
            }
        }

        async function eseguiAlert(btn) {
            if (!confirm("Vuoi inviare via email i solleciti automatici ai tesserati filtrati?")) return;
            
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> INVIO...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/scadenze-alert', { method: 'POST' });
                const result = await response.json();

                if (response.ok) {
                    alert(`Operazione completata!\nTesserati processati: ${result.processed}\nEmail inviate: ${result.logs.length}`);
                } else {
                    alert("Errore API: " + (result.error || 'Sconosciuto'));
                }
            } catch (err) {
                alert("Errore connessione: " + err.message);
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        caricaScadenze();
    </script>
</body>
</html>
