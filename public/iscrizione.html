<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domanda di Ammissione a Socio - A.S.D. Fight Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4 flex justify-center items-center">
  <div class="max-w-2xl w-full bg-white rounded-lg shadow-md p-6 md:p-8">
    
    <!-- Intestazione Legale & Associativa -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">A.S.D. FIGHT ACADEMY</h1>
      <p class="text-xs text-gray-600">C.F. 91023520280 - Affiliata ASI (VEN-PD0814) - Via Monte Cero 57, Este (PD)</p>
      <h2 class="text-xl font-semibold mt-4 text-blue-900">DOMANDA DI AMMISSIONE A SOCIO</h2>
    </div>

    <!-- Box Messaggio Successo -->
    <div id="success-box" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 text-center">
      <p class="font-bold text-lg">Domanda Registrata con Successo!</p>
      <p class="text-sm mt-1">La tua richiesta di ammissione a socio è stata inviata alla segreteria dell'A.S.D. Fight Academy.</p>
    </div>

    <!-- Box Messaggio Errore -->
    <div id="error-box" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      <p class="font-bold">Errore durante l'invio!</p>
      <p id="error-message" class="text-sm"></p>
    </div>

    <!-- Modulo Iscrizione -->
    <form id="registration-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nome e Cognome *</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="nome" name="nome" required placeholder="Nome" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
          <input type="text" id="cognome" name="cognome" required placeholder="Cognome" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Codice Fiscale *</label>
        <input type="text" id="codice_fiscale" name="codice_fiscale" maxlength="16" required placeholder="RSSMRA80A01D442X" class="w-full p-2 border rounded uppercase focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email *</label>
          <input type="email" id="email" name="email" required placeholder="mario@example.com" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Telefono / Cellulare *</label>
          <input type="tel" id="telefono" name="telefono" required placeholder="3926641714" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Attività Scelta *</label>
        <select id="corso" name="corso" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
          <option value="">-- Seleziona il Corso --</option>
          <option value="Ninjutsu Adulti/Ragazzi">Ninjutsu Adulti/Ragazzi (Mar/Gio 19:30-21:00)</option>
          <option value="Ninjutsu Bambini">Ninjutsu Bambini (Mar/Gio 18:30-19:30)</option>
          <option value="Vietvodao Adulti/Ragazzi">Vietvodao Adulti/Ragazzi (Lun/Mer 19:30-21:00)</option>
          <option value="Vietvodao Bambini">Vietvodao Bambini (Lun/Mer 18:30-19:30)</option>
        </select>
      </div>

      <div class="space-y-2 pt-2 text-xs text-gray-600">
        <div class="flex items-start">
          <input type="checkbox" id="accetto_privacy" required class="mt-1 mr-2">
          <label for="accetto_privacy">Accetto l'Informativa sul Trattamento dei Dati Personali (Art. 13 D.Lgs. 196/2003 e Reg. UE 2016/679). *</label>
        </div>
        <div class="flex items-start">
          <input type="checkbox" id="accetto_media" required class="mt-1 mr-2">
          <label for="accetto_media">Cedo a titolo gratuito alla Associazione FIGHT ACADEMY il diritto di utilizzare immagini filmate o fotografiche relative alle attività istituzionali. *</label>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-blue-900 text-white font-bold py-3 px-4 rounded hover:bg-blue-800 transition duration-200">
        Invia Domanda di Iscrizione
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://twiizsottstaacnvrxkg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI";
    
    if (!window.dbClient) {
      window.dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    const db = window.dbClient;

    const form = document.getElementById('registration-form');
    const submitBtn = document.getElementById('submit-btn');
    const successBox = document.getElementById('success-box');
    const errorBox = document.getElementById('error-box');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Registrazione in corso...";
      errorBox.classList.add('hidden');

      const nome = document.getElementById('nome').value.trim();
      const cognome = document.getElementById('cognome').value.trim();
      const codice_fiscale = document.getElementById('codice_fiscale').value.trim().toUpperCase();
      const email = document.getElementById('email').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const nomeCorsoSelezionato = document.getElementById('corso').value;

      try {
        // 1. Inserimento del Socio nella tabella 'soci'
        const { data: socio, error: socioError } = await db
          .from('soci')
          .insert([{
            nome: nome,
            cognome: cognome,
            codice_fiscale: codice_fiscale,
            email: email,
            telefono: telefono,
            stato: 'richiesta'
          }])
          .select()
          .single();

        if (socioError) throw new Error("Errore salvataggio socio: " + socioError.message);

        // 2. Recupero ID Corso con ricerca flessibile sulla colonna corretta 'nome_corso'
        if (nomeCorsoSelezionato && socio) {
          const keyword = nomeCorsoSelezionato.split(' ')[0];
          
          const { data: corsiData, error: corsoFindError } = await db
            .from('corsi')
            .select('id, nome_corso')
            .ilike('nome_corso', `%${keyword}%`);

          let corsoId = null;
          if (corsiData && corsiData.length > 0) {
            const matchEsatto = corsiData.find(c => c.nome_corso.toLowerCase().includes(nomeCorsoSelezionato.toLowerCase()));
            corsoId = matchEsatto ? matchEsatto.id : corsiData[0].id;
          }

          if (corsoId) {
            const { error: errSociCorsi } = await db
              .from('soci_corsi')
              .insert([{
                socio_id: socio.id,
                corso_id: corsoId
              }]);

            if (errSociCorsi) {
              console.error("Errore salvataggio soci_corsi:", errSociCorsi.message);
            }
          } else {
            console.warn("Nessun corso corrispondente trovato per la parola chiave:", keyword);
          }
        }

        // 3. Invio email tramite Serverless Function /api/send-email
        try {
          const emailRes = await fetch('/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nome: nome,
              cognome: cognome,
              email: email,
              telefono: telefono,
              codice_fiscale: codice_fiscale,
              corso: nomeCorsoSelezionato
            })
          });
          if (!emailRes.ok) {
            console.warn("Risposta API email non OK:", await emailRes.text());
          }
        } catch (emailErr) {
          console.warn("Avviso invio email API:", emailErr);
        }

        // Mostra il messaggio di conferma finale
        form.classList.add('hidden');
        successBox.classList.remove('hidden');

      } catch (err) {
        console.error('Errore durante la procedura:', err);
        errorMessage.innerText = err.message || "Errore durante la registrazione nel database.";
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = "Invia Domanda di Iscrizione";
      }
    });
  </script>
</body>
</html>
