<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Configurazione Supabase Client
  const SUPABASE_URL = "https://twiizsottstaacnvrxkg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('form-iscrizione');
  const btnSubmit = document.getElementById('btn-submit');
  const successBox = document.getElementById('success-message');
  const errorBox = document.getElementById('error-message');

  form.addEventListener('submit', async function(e) {
    // 1. BLOCCO FONDAMENTALE: Impedisce il ricaricamento della pagina
    e.preventDefault();

    btnSubmit.disabled = true;
    btnSubmit.innerText = "Registrazione in corso...";
    if (errorBox) errorBox.classList.add('hidden');

    try {
      // 2. Raccolta Dati dal Form
      const formData = new FormData(form);
      const socioData = {
        nome: formData.get('nome'),
        cognome: formData.get('cognome'),
        codice_fiscale: formData.get('codice_fiscale')?.toUpperCase(),
        data_nascita: formData.get('data_nascita') || null,
        luogo_nascita: formData.get('luogo_nascita') || null,
        residenza_indirizzo: formData.get('residenza_indirizzo') || null,
        residenza_civico: formData.get('residenza_civico') || null,
        residenza_cap: formData.get('residenza_cap') || null,
        residenza_citta: formData.get('residenza_citta') || null,
        residenza_provincia: formData.get('residenza_provincia') || null,
        email: formData.get('email'),
        telefono: formData.get('telefono') || null,
        accetto_privacy: formData.get('accetto_privacy') === 'on',
        accetto_media: formData.get('accetto_media') === 'on'
      };

      const corsoSelezionato = formData.get('corso');

      // 3. Inserimento Socio in Supabase
      const { data: socioInserito, error: errSocio } = await supabase
        .from('soci')
        .insert([socioData])
        .select()
        .single();

      if (errSocio) throw new Error("Errore salvataggio socio: " + errSocio.message);

      // 4. Inserimento Corso in soci_corsi (se selezionato)
      if (corsoSelezionato && socioInserito) {
        const { error: errCorso } = await supabase
          .from('soci_corsi')
          .insert([{
            socio_id: socioInserito.id,
            corso_nome: corsoSelezionato,
            data_iscrizione: new Date().toISOString()
          }]);
        
        if (errCorso) console.warn("Avviso salvataggio corso:", errCorso.message);
      }

      // 5. Chiamata API per invio Notifica Email (Serverless Function Vercel)
      try {
        await fetch('/api/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: socioData.nome,
            cognome: socioData.cognome,
            email: socioData.email,
            corso: corsoSelezionato
          })
        });
      } catch (errEmail) {
        console.warn("L'iscrizione è stata salvata sul DB, ma l'invio della mail ha generato un avviso:", errEmail);
      }

      // 6. Mostra Messaggio di Conferma a Schermo
      form.classList.add('hidden');
      if (successBox) {
        successBox.classList.remove('hidden');
      } else {
        alert("Domanda Registrata con Successo! Sarai contattato a breve dalla segreteria dell'ASD Fight Academy.");
      }

    } catch (err) {
      console.error(err);
      if (errorBox) {
        errorBox.innerText = err.message;
        errorBox.classList.remove('hidden');
      } else {
        alert("Si è verificato un errore durante l'invio: " + err.message);
      }
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Invia Domanda di Iscrizione";
    }
  });
</script>
