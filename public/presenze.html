<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Fight Academy - Registro Presenze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="/favicon.ico?v=6">
    <link rel="manifest" href="/manifest.json?v=5">
    <link rel="icon" type="image/png" href="/logo.png?v=5">
    <link rel="apple-touch-icon" href="/logo.png?v=5">
    <meta name="theme-color" content="#b91c1c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FightAcademy">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">

    <div class="container mx-auto max-w-2xl">
        <header class="mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-xl font-bold text-purple-500">REGISTRO APPELLO</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Area Riservata Istruttori</p>
            </div>
            <div class="flex gap-2">
                <a href="admin.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <button onclick="logout()" class="bg-red-900/50 hover:bg-red-800 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-red-900/30 uppercase">
                    <i class="fa-solid fa-power-off"></i> Esci
                </button>
            </div>
        </header>

        <main class="space-y-6">
            <div class="grid grid-cols-2 gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
                <button id="tab-appello" onclick="mostraVistaPresenze('appello')" class="bg-purple-600 text-white font-bold py-2 rounded-lg text-xs uppercase"><i class="fa-solid fa-clipboard-check mr-1"></i> Appello</button>
                <button id="tab-storico" onclick="mostraVistaPresenze('storico')" class="text-slate-400 hover:text-white font-bold py-2 rounded-lg text-xs uppercase"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Storico</button>
            </div>

            <div id="vista-appello" class="space-y-6">
            <!-- SELEZIONE CORSO E DATA -->
            <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Seleziona Corso</label>
                        <select id="corso-select" onchange="caricaIscritti()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-purple-500 outline-none">
                            <option value="">-- Scegli un corso --</option>
                            <!-- Filtrati dinamicamente via JS al caricamento -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Data Lezione</label>
                        <input type="date" id="data-lezione" onchange="caricaIscritti()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
            </section>

            <!-- LISTA ALLIEVI -->
            <section id="lista-allievi-container" class="hidden bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                <div class="p-4 bg-slate-700/30 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="text-sm font-bold text-white uppercase">Appello Allievi</h3>
                    <span id="counter-presenti" class="text-[10px] bg-purple-600 text-white px-2 py-0.5 rounded-full font-bold">0 PRESENTI</span>
                </div>

                <div id="lista-iscritti" class="divide-y divide-slate-700 max-h-[400px] overflow-y-auto">
                    <!-- Dinamico -->
                </div>

                <div class="p-4 bg-slate-900/50">
                    <button id="salva-btn" onclick="salvaPresenze()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        SALVA PRESENZE
                    </button>
                </div>
            </section>

            <div id="placeholder" class="text-center py-12 text-slate-500 italic text-sm">
                <i class="fa-solid fa-clipboard-list text-4xl mb-3 opacity-20"></i>
                <p>Seleziona un corso per visualizzare gli allievi</p>
            </div>
            </div>

            <section id="vista-storico" class="hidden space-y-4">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-400 uppercase mb-1">Corso</label><select id="storico-corso" onchange="caricaStoricoPresenze()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none"></select></div>
                        <div><label class="block text-xs font-bold text-slate-400 uppercase mb-1">Cerca tesserato</label><input id="storico-ricerca" type="search" oninput="filtraStoricoPresenze()" placeholder="Nome o cognome" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-400 uppercase mb-1">Dal</label><input id="storico-dal" type="date" onchange="caricaStoricoPresenze()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none"></div>
                        <div><label class="block text-xs font-bold text-slate-400 uppercase mb-1">Al</label><input id="storico-al" type="date" onchange="caricaStoricoPresenze()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none"></div>
                    </div>
                </div>
                <div id="storico-riepilogo" class="grid grid-cols-3 gap-2"></div>
                <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                    <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead class="bg-slate-900/50 text-slate-400 uppercase"><tr><th class="p-3">Data</th><th class="p-3">Corso</th><th class="p-3">Tesserato</th></tr></thead><tbody id="storico-tbody" class="divide-y divide-slate-700/50 text-slate-300"></tbody></table></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Controllo Accesso Istruttori / Presidente
        const sessionUser = JSON.parse(localStorage.getItem('asd_admin_user'));
        if (!sessionUser) {
            alert("Accesso negato. Effettua il login dall'area istruttori.");
            location.href = 'admin.html';
        }

        // Funzione Logout rapido
        function logout() {
            localStorage.removeItem('asd_admin_user');
            location.href = 'admin.html';
        }

        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getAnnoAccademico(data = new Date()) {
            const anno = data.getFullYear();
            const inizioStagione = new Date(anno, 7, 1);
            const annoInizio = data >= inizioStagione ? anno : anno - 1;
            return `${annoInizio}/${annoInizio + 1}`;
        }

        function formatDataItaliana(value) {
            if (!value) return '';
            const [anno, mese, giorno] = String(value).slice(0, 10).split('-');
            return anno && mese && giorno ? `${giorno}-${mese}-${anno}` : value;
        }

        function parseDataItaliana(value) {
            const match = String(value || '').trim().match(/^(?:(\d{2})-(\d{2})-(\d{4})|(\d{4})-(\d{2})-(\d{2}))$/);
            if (!match) return null;
            const [, giornoIt, meseIt, annoIt, annoIso, meseIso, giornoIso] = match;
            const giorno = giornoIt || giornoIso;
            const mese = meseIt || meseIso;
            const anno = annoIt || annoIso;
            const data = new Date(Number(anno), Number(mese) - 1, Number(giorno));
            return data.getFullYear() === Number(anno) && data.getMonth() === Number(mese) - 1 && data.getDate() === Number(giorno)
                ? `${anno}-${mese}-${giorno}`
                : null;
        }

        document.getElementById('data-lezione').value = new Date().toISOString().split('T')[0];
        const oggi = new Date();
        const inizioAnnoAccademico = new Date(oggi.getFullYear() - (oggi.getMonth() < 7 ? 1 : 0), 7, 1);
        const dataInizioAnnoAccademico = inizioAnnoAccademico.toISOString().split('T')[0];
        document.getElementById('storico-dal').value = dataInizioAnnoAccademico;
        document.getElementById('storico-al').value = oggi.toISOString().split('T')[0];

        // Popolamento dinamico select corsi in base ai permessi
        const corsoSelect = document.getElementById('corso-select');
        const tuttiICorsi = [
            { val: "Ninjutsu Adulti/Ragazzi", lab: "Ninjutsu Adulti / Ragazzi" },
            { val: "Ninjutsu Bambini", lab: "Ninjutsu Bambini" },
            { val: "Vietvodao Adulti/Ragazzi", lab: "Vietvodao Adulti / Ragazzi" },
            { val: "Vietvodao Bambini", lab: "Vietvodao Bambini" },
            { val: "Shodo (Calligrafia Giapponese)", lab: "Shodo (Calligrafia Giapponese)" }
        ];

        function normalizeCorsoNome(value) {
            if (!value) return '';
            return String(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[\/\-_]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase()
                .replace(/\badulti(?:ma|m[a])?\b/g, 'adulti');
        }

        function corsoCorrisponde(a, b) {
            const nomeA = normalizeCorsoNome(a);
            const nomeB = normalizeCorsoNome(b);
            if (!nomeA || !nomeB) return false;
            if (nomeA === nomeB) return true;
            if (nomeA.includes('vietvodao') && nomeB.includes('vietvodao')) {
                const aAdulti = nomeA.includes('adulti');
                const aRagazzi = nomeA.includes('ragazzi');
                const bAdulti = nomeB.includes('adulti');
                const bRagazzi = nomeB.includes('ragazzi');
                return (aAdulti || aRagazzi) && (bAdulti || bRagazzi);
            }
            return nomeA.includes(nomeB) || nomeB.includes(nomeA);
        }

        tuttiICorsi.forEach(c => {
            const haCompetenza = (sessionUser.corsi_competenze || []).some(comp => corsoCorrisponde(comp, c.val));
            if (sessionUser.ruolo === 'presidente' || haCompetenza) {
                const opt = document.createElement('option');
                opt.value = c.val;
                opt.textContent = c.lab;
                corsoSelect.appendChild(opt);
            }
        });

        const storicoCorsoSelect = document.getElementById('storico-corso');
        storicoCorsoSelect.innerHTML = '<option value="tutti">Tutti i corsi autorizzati</option>';
        tuttiICorsi.forEach(c => {
            const haCompetenza = (sessionUser.corsi_competenze || []).some(comp => corsoCorrisponde(comp, c.val));
            if (sessionUser.ruolo === 'presidente' || haCompetenza) {
                const opt = document.createElement('option');
                opt.value = c.val;
                opt.textContent = c.lab;
                storicoCorsoSelect.appendChild(opt);
            }
        });

        let allieviCaricati = [];
        const presentiIds = new Set();
        let storicoPresenze = [];

        function mostraVistaPresenze(vista) {
            const storico = vista === 'storico';
            document.getElementById('vista-appello').classList.toggle('hidden', storico);
            document.getElementById('vista-storico').classList.toggle('hidden', !storico);
            document.getElementById('tab-appello').className = storico ? 'text-slate-400 hover:text-white font-bold py-2 rounded-lg text-xs uppercase' : 'bg-purple-600 text-white font-bold py-2 rounded-lg text-xs uppercase';
            document.getElementById('tab-storico').className = storico ? 'bg-purple-600 text-white font-bold py-2 rounded-lg text-xs uppercase' : 'text-slate-400 hover:text-white font-bold py-2 rounded-lg text-xs uppercase';
            if (storico) caricaStoricoPresenze();
        }

        async function caricaStoricoPresenze() {
            const corsoSelezionato = storicoCorsoSelect.value;
            const dal = parseDataItaliana(document.getElementById('storico-dal').value);
            const al = parseDataItaliana(document.getElementById('storico-al').value);
            if (!dal || !al) { alert('Seleziona le date di inizio e fine periodo.'); return; }
            const tbody = document.getElementById('storico-tbody');
            tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center"><i class="fa-solid fa-spinner fa-spin text-purple-500"></i></td></tr>';

            try {
                const corsiAutorizzati = tuttiICorsi
                    .filter(c => sessionUser.ruolo === 'presidente' || (sessionUser.corsi_competenze || []).some(comp => corsoCorrisponde(comp, c.val)))
                    .map(c => c.val);
                let query = supabaseClient.from('presenze').select('socio_id, data_presenza, corso').gte('data_presenza', dal).lte('data_presenza', al).order('data_presenza', { ascending: false });
                if (corsoSelezionato !== 'tutti') query = query.eq('corso', corsoSelezionato);
                else if (sessionUser.ruolo !== 'presidente') query = query.in('corso', corsiAutorizzati);
                const { data: presenze, error } = await query;
                if (error) throw error;

                const socioIds = [...new Set((presenze || []).map(p => p.socio_id))];
                const { data: soci, error: sociError } = socioIds.length
                    ? await supabaseClient.from('soci').select('id, nome, cognome').in('id', socioIds)
                    : { data: [], error: null };
                if (sociError) throw sociError;
                const sociPerId = new Map((soci || []).map(s => [s.id, s]));
                storicoPresenze = (presenze || []).map(p => ({ ...p, socio: sociPerId.get(p.socio_id) }));
                filtraStoricoPresenze();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-400">Errore caricamento storico: ${err.message}</td></tr>`;
            }
        }

        function filtraStoricoPresenze() {
            const ricerca = document.getElementById('storico-ricerca').value.trim().toLowerCase();
            const righe = storicoPresenze.filter(p => `${p.socio?.nome || ''} ${p.socio?.cognome || ''}`.toLowerCase().includes(ricerca));
            const lezioni = new Set(righe.map(p => `${p.corso}|${p.data_presenza}`)).size;
            const tesserati = new Set(righe.map(p => p.socio_id)).size;
            document.getElementById('storico-riepilogo').innerHTML = [
                ['Lezioni', lezioni], ['Presenze', righe.length], ['Tesserati', tesserati]
            ].map(([label, valore]) => `<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center"><p class="text-[8px] uppercase font-bold text-slate-500">${label}</p><p class="text-lg font-black text-purple-400">${valore}</p></div>`).join('');
            document.getElementById('storico-tbody').innerHTML = righe.length
                ? righe.map(p => `<tr><td class="p-3">${new Date(`${p.data_presenza}T00:00:00`).toLocaleDateString('it-IT')}</td><td class="p-3">${p.corso}</td><td class="p-3 font-bold text-white">${p.socio ? `${p.socio.cognome} ${p.socio.nome}` : 'Tesserato non disponibile'}</td></tr>`).join('')
                : '<tr><td colspan="3" class="p-8 text-center text-slate-500">Nessuna presenza nel periodo selezionato.</td></tr>';
        }

        async function caricaIscritti() {
            const corso = document.getElementById('corso-select').value;
            const dataLezione = parseDataItaliana(document.getElementById('data-lezione').value);
            if (!corso || !dataLezione) return;

            const listContainer = document.getElementById('lista-allievi-container');
            const placeholder = document.getElementById('placeholder');
            const listContent = document.getElementById('lista-iscritti');

            listContent.innerHTML = '<div class="p-8 text-center"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-2xl"></i></div>';
            listContainer.classList.remove('hidden');
            placeholder.classList.add('hidden');
            presentiIds.clear();
            aggiornaContatore();

            try {
                // Controllo competenza corso per istruttori (non presidente)
                if (sessionUser.ruolo !== 'presidente') {
                    const comp = sessionUser.corsi_competenze || [];
                    if (!comp.some(c => corsoCorrisponde(c, corso))) {
                        alert("Non hai i permessi per gestire questo corso.");
                        return;
                    }
                }

                // 1. Carica i tesserati del corso nella stagione corrente.
                const { data: iscrizioniCorso, error: iscrizioniError } = await supabaseClient
                    .from('iscrizioni_annuali')
                    .select('socio_id')
                    .eq('nome_corso', corso)
                    .eq('anno_accademico', getAnnoAccademico());

                if (iscrizioniError) throw iscrizioniError;

                const socioIds = [...new Set((iscrizioniCorso || []).map(i => i.socio_id))];

                const { data: soci, error: sociError } = socioIds.length > 0
                    ? await supabaseClient
                        .from('soci')
                        .select('id, nome, cognome, codice_fiscale')
                        .in('id', socioIds)
                        .order('cognome', { ascending: true })
                    : { data: [], error: null };

                if (sociError) throw sociError;

                // 2. Carica Totale Lezioni del corso (date uniche in presenze)
                const { data: presenzeCorso, error: presenzeError } = await supabaseClient
                    .from('presenze')
                    .select('data_presenza, socio_id')
                    .eq('corso', corso)
                    .gte('data_presenza', dataInizioAnnoAccademico);
                
                if (presenzeError) throw presenzeError;

                // Calcolo statistiche
                const dateUniche = [...new Set(presenzeCorso.map(p => p.data_presenza))];
                const totaleLezioni = dateUniche.length;

                presenzeCorso
                    .filter(p => p.data_presenza === dataLezione)
                    .forEach(p => presentiIds.add(p.socio_id));

                allieviCaricati = (soci || []).map(s => {
                    const presenzeTesserato = presenzeCorso.filter(p => p.socio_id === s.id).length;
                    const percentuale = totaleLezioni > 0 ? Math.round((presenzeTesserato / totaleLezioni) * 100) : 0;
                    return { ...s, percentuale };
                });

                renderLista();
            } catch (err) {
                console.error(err);
                listContent.innerHTML = `<p class="p-8 text-center text-red-400">Errore nel caricamento allievi: ${err.message}</p>`;
            }
        }

        function renderLista() {
            const listContent = document.getElementById('lista-iscritti');
            if (allieviCaricati.length === 0) {
                listContent.innerHTML = '<p class="p-8 text-center text-slate-500">Nessun allievo trovato per questo corso.</p>';
                return;
            }

            listContent.innerHTML = allieviCaricati.map(allievo => {
                const isIdoneo = allievo.percentuale >= 70;
                const colorClass = isIdoneo ? 'text-green-400' : 'text-red-400';
                const isPresente = presentiIds.has(allievo.id);
                
                return `
                    <div class="flex items-center justify-between p-4 hover:bg-slate-700/50 transition cursor-pointer" onclick="togglePresence('${allievo.id}')">
                        <div class="flex items-center gap-3">
                            <div id="check-${allievo.id}" class="w-6 h-6 border-2 ${isPresente ? 'bg-purple-600 border-purple-600' : 'border-slate-600'} rounded-lg flex items-center justify-center transition-all">
                                <i class="fa-solid fa-check text-white text-xs ${isPresente ? '' : 'hidden'}"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-white">${allievo.cognome} ${allievo.nome}</p>
                                <p class="text-[10px] text-slate-500 uppercase">${allievo.codice_fiscale || ''}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold ${colorClass}">${allievo.percentuale}%</p>
                            <p class="text-[9px] text-slate-500 uppercase">${isIdoneo ? 'Idoneo Esami' : 'Frequenza Bassa'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function togglePresence(id) {
            const checkbox = document.getElementById(`check-${id}`);
            const icon = checkbox.querySelector('i');
            
            if (presentiIds.has(id)) {
                presentiIds.delete(id);
                checkbox.classList.remove('bg-purple-600', 'border-purple-600');
                checkbox.classList.add('border-slate-600');
                icon.classList.add('hidden');
            } else {
                presentiIds.add(id);
                checkbox.classList.add('bg-purple-600', 'border-purple-600');
                checkbox.classList.remove('border-slate-600');
                icon.classList.remove('hidden');
            }
            aggiornaContatore();
        }

        function aggiornaContatore() {
            document.getElementById('counter-presenti').textContent = `${presentiIds.size} PRESENTI`;
        }

        async function salvaPresenze() {
            const corso = document.getElementById('corso-select').value;
            const dataLezione = parseDataItaliana(document.getElementById('data-lezione').value);
            if (!dataLezione) { alert('Seleziona la data della lezione.'); return; }
            
            if (presentiIds.size === 0) {
                if (!confirm("Nessun presente selezionato. Vuoi salvare un appello senza presenti?")) return;
            }

            const btn = document.getElementById('salva-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> SALVATAGGIO...';

            const records = Array.from(presentiIds).map(socioId => ({
                socio_id: socioId,
                data_presenza: dataLezione,
                corso: corso
            }));

            try {
                // Rimuove le presenze già registrate per questo corso/data prima di riscriverle,
                // così non serve un vincolo univoco lato database per l'upsert.
                const socioIdsCorso = allieviCaricati.map(a => a.id);
                if (socioIdsCorso.length > 0) {
                    const { error: deleteError } = await supabaseClient
                        .from('presenze')
                        .delete()
                        .eq('corso', corso)
                        .eq('data_presenza', dataLezione)
                        .in('socio_id', socioIdsCorso);
                    if (deleteError) throw deleteError;
                }

                if (records.length > 0) {
                    const { error } = await supabaseClient
                        .from('presenze')
                        .insert(records);
                    if (error) throw error;
                }

                alert("Presenze salvate correttamente!");
                location.reload();
            } catch (err) {
                alert("Errore nel salvataggio: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> SALVA PRESENZE';
            }
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
