<script>
        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Imposta data odierna
        document.getElementById('data-lezione').value = new Date().toISOString().split('T')[0];

        let allieviCaricati = [];

        async function caricaIscritti() {
            const corsoId = document.getElementById('corso-select').value;
            if (!corsoId) return;

            const listContainer = document.getElementById('lista-allievi-container');
            const placeholder = document.getElementById('placeholder');
            const listContent = document.getElementById('lista-iscritti');

            listContent.innerHTML = '<div class="p-8 text-center"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-2xl"></i></div>';
            listContainer.classList.remove('hidden');
            placeholder.classList.add('hidden');

            try {
                // INTERROGAZIONE CORRETTA: Legge dalla tabella ponte iscrizioni_corsi unendo i dati del socio
                const { data, error } = await supabaseClient
                    .from('iscrizioni_corsi')
                    .select(`
                        id,
                        socio_id,
                        soci (
                            id,
                            nome,
                            cognome,
                            email
                        )
                    `)
                    .eq('corso_id', corsoId)
                    .eq('stato', 'attivo');

                if (error) throw error;

                // Mappiamo i dati per averli puliti nel frontend
                allieviCaricati = (data || []).map(item => ({
                    iscrizione_id: item.id,
                    nome: item.soci.nome,
                    cognome: item.soci.cognome,
                    email: item.soci.email
                }));

                renderLista();
            } catch (err) {
                console.error(err);
                alert("Errore nel caricamento allievi: " + err.message);
            }
        }

        function renderLista() {
            const listContent = document.getElementById('lista-iscritti');
            if (allieviCaricati.length === 0) {
                listContent.innerHTML = '<p class="p-8 text-center text-slate-500">Nessun allievo attivo trovato per questo corso.</p>';
                return;
            }

            listContent.innerHTML = allieviCaricati.map(allievo => `
                <div class="flex items-center justify-between p-4 hover:bg-slate-700/50 transition cursor-pointer" onclick="togglePresence('${allievo.iscrizione_id}')">
                    <div class="flex items-center gap-3">
                        <div id="check-${allievo.iscrizione_id}" class="w-6 h-6 border-2 border-slate-600 rounded-lg flex items-center justify-center transition-all">
                            <i class="fa-solid fa-check text-white text-xs hidden"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-white">${allievo.cognome} ${allievo.nome}</p>
                            <p class="text-[10px] text-slate-500 uppercase">${allievo.email || ''}</p>
                        </div>
                    </div>
                </div>
            `).join('');
            
            aggiornaContatore();
        }

        const presentiIscrizioniIds = new Set();

        function togglePresence(iscrizioneId) {
            const checkbox = document.getElementById(`check-${iscrizioneId}`);
            const icon = checkbox.querySelector('i');
            
            if (presentiIscrizioniIds.has(iscrizioneId)) {
                presentiIscrizioniIds.delete(iscrizioneId);
                checkbox.classList.remove('bg-purple-600', 'border-purple-600');
                checkbox.classList.add('border-slate-600');
                icon.classList.add('hidden');
            } else {
                presentiIscrizioniIds.add(iscrizioneId);
                checkbox.classList.add('bg-purple-600', 'border-purple-600');
                checkbox.classList.remove('border-slate-600');
                icon.classList.remove('hidden');
            }
            aggiornaContatore();
        }

        function aggiornaContatore() {
            document.getElementById('counter-presenti').textContent = `${presentiIscrizioniIds.size} PRESENTI`;
        }

        async function salvaPresenze() {
            if (presentiIscrizioniIds.size === 0) {
                if (!confirm("Non hai selezionato nessun presente. Salvare comunque l'appello vuoto?")) return;
            }

            const btn = document.getElementById('salva-btn');
            const dataLezione = document.getElementById('data-lezione').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> SALVATAGGIO...';

            // Salvataggio basato sulla nuova tabella presenze (collegata a iscrizione_id)
            const records = Array.from(presentiIscrizioniIds).map(iscrizioneId => ({
                iscrizione_id: iscrizioneId,
                data_lezione: dataLezione,
                presente: true
            }));

            try {
                const { error } = await supabaseClient
                    .from('presenze')
                    .insert(records);

                if (error) throw error;

                alert("Appello salvato correttamente!");
                location.reload();
            } catch (err) {
                console.error(err);
                alert("Errore durante il salvataggio: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> SALVA PRESENZE DI OGGI';
            }
        }
    </script>
