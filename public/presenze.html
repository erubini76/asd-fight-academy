<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Fight Academy - Registro Presenze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">

    <div class="container mx-auto max-w-2xl">
        <header class="mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-xl font-bold text-purple-500">REGISTRO APPELLO</h1>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-xs transition">
                <i class="fa-solid fa-house"></i>
            </a>
        </header>

        <main class="space-y-6">
            <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Seleziona Corso</label>
                        <select id="corso-select" onchange="caricaIscritti()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-purple-500 outline-none">
                            <option value="">-- Scegli un corso --</option>
                            <option value="Ninjutsu Adulti/Ragazzi">Ninjutsu Adulti / Ragazzi</option>
                            <option value="Ninjutsu Bambini">Ninjutsu Bambini</option>
                            <option value="Vietvodao Adulti/Ragazzi">Vietvodao Adulti / Ragazzi</option>
                            <option value="Vietvodao Bambini">Vietvodao Bambini</option>
                            <option value="Shodo (Calligrafia)">Shodo (Calligrafia)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Data Lezione</label>
                        <input type="date" id="data-lezione" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
            </section>

            <section id="lista-allievi-container" class="hidden bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                <div class="p-4 bg-slate-700/30 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="text-sm font-bold text-white uppercase">Allievi Trovati</h3>
                </div>
                <div id="lista-iscritti" class="divide-y divide-slate-700 max-h-[400px] overflow-y-auto"></div>
                <div class="p-4 bg-slate-900/50">
                    <button id="salva-btn" onclick="salvaPresenze()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200">SALVA PRESENZE</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        const supabase = supabase.createClient('https://twiizsottstaacnvrxkg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI');
        
        document.getElementById('data-lezione').value = new Date().toISOString().split('T')[0];

        async function caricaIscritti() {
            const corso = document.getElementById('corso-select').value;
            if (!corso) return;

            const container = document.getElementById('lista-iscritti');
            container.innerHTML = '<div class="p-4 text-center">Caricamento...</div>';
            document.getElementById('lista-allievi-container').classList.remove('hidden');

            const { data, error } = await supabase
                .from('soci')
                .select('id, nome, cognome')
                .or(`corso.eq.${corso},corso_scelto.eq.${corso}`);
            
            if (error) { alert("Errore: " + error.message); return; }
            
            if(data.length === 0) {
                container.innerHTML = '<p class="p-4 text-center text-slate-500">Nessun iscritto trovato per questo corso.</p>';
            } else {
                container.innerHTML = data.map(s => `
                    <div class="flex items-center gap-3 p-4 hover:bg-slate-700 transition">
                        <input type="checkbox" class="presente-check w-5 h-5" value="${s.id}">
                        <span class="text-lg">${s.cognome} ${s.nome}</span>
                    </div>
                `).join('');
            }
        }

        async function salvaPresenze() {
            const data = document.getElementById('data-lezione').value;
            const corso = document.getElementById('corso-select').value;
            const checked = document.querySelectorAll('.presente-check:checked');
            
            if (checked.length === 0) { alert("Seleziona almeno un socio!"); return; }
            
            const records = Array.from(checked).map(c => ({
                socio_id: c.value,
                data_presenza: data,
                corso: corso
            }));

            const { error } = await supabase.from('presenze').insert(records);
            if (error) alert("Errore: " + error.message);
            else { alert("Presenze salvate!"); location.reload(); }
        }
    </script>
</body>
</html>
