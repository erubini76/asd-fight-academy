<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.D. Fight Academy - Area Riservata Socio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center font-sans">

    <div class="container mx-auto max-w-2xl w-full">
        <!-- Header con tasto Home -->
        <header class="mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight leading-tight uppercase">Area Socio</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Portale Atleti e Famiglie</p>
                </div>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </header>

        <main class="space-y-6">
            <!-- LOGIN SICURO (EMAIL + CODICE FISCALE) -->
            <section id="searchSection" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-white uppercase tracking-tight">Accedi al tuo Profilo</h2>
                    <p class="text-xs text-slate-400 mt-1 italic">Inserisci i tuoi dati per gestire certificati e pagamenti.</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Email Registrata</label>
                        <input type="email" id="userEmail" placeholder="es. m.rossi@email.it" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:ring-2 focus:ring-cyan-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Codice Fiscale</label>
                        <input type="text" id="userCf" placeholder="es. RSSMRA80A01Z100A" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm uppercase text-white focus:ring-2 focus:ring-cyan-500 outline-none transition font-mono tracking-widest">
                    </div>
                    <button onclick="cercaSocio()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg transform active:scale-95 flex items-center justify-center gap-2 uppercase tracking-wider">
                        <i class="fa-solid fa-lock"></i> Accedi in Sicurezza
                    </button>
                </div>
            </section>

            <!-- PORTALE FAMIGLIA / UTENTE -->
            <div id="portalSection" class="hidden space-y-6">
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center">
                    <h2 class="font-bold text-white text-base uppercase tracking-wider">Pannello Controllo Socio</h2>
                    <p class="text-[10px] text-slate-400 mt-0.5 uppercase tracking-widest">Gestione Iscrizione, Pagamenti e Documenti</p>
                </div>

                <!-- LISTA PROFILI -->
                <div id="profiliContainer" class="space-y-6"></div>

                <button onclick="logoutSocio()" class="w-full text-center text-[10px] text-slate-500 hover:text-slate-300 transition mt-4 font-bold uppercase tracking-[0.2em]">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i> Esci / Cambia Profilo
                </button>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let foundSociList = [];

        async function cercaSocio() {
            const email = document.getElementById('userEmail').value.trim().toLowerCase();
            const cf = document.getElementById('userCf').value.trim().toUpperCase();

            if (!email || !cf) {
                alert("Inserisci sia l'email che il Codice Fiscale.");
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('soci')
                    .select('*')
                    .eq('email', email);

                if (error) throw error;
                if (!data || data.length === 0) {
                    alert("Nessun socio trovato con questa email.");
                    return;
                }

                const match = data.some(s => (s.codice_fiscale || '').toUpperCase() === cf);
                if (!match) {
                    alert("Il Codice Fiscale non corrisponde ai dati registrati per questa email.");
                    return;
                }

                foundSociList = data;
                localStorage.setItem('foundSociList', JSON.stringify(foundSociList));
                renderPortal();
            } catch (err) {
                alert("Errore durante l'accesso: " + err.message);
            }
        }

        async function logoutSocio() {
            localStorage.removeItem('foundSociList');
            location.reload();
        }

        function renderPortal() {
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');

            const container = document.getElementById('profiliContainer');
            container.innerHTML = '';

            foundSociList.forEach((socio) => {
                const medScaduto = !socio.scadenza_certificato_medico || new Date(socio.scadenza_certificato_medico) < new Date();
                const iscrizioneConfermata = socio.stato_approvazione === 'Approvato';
                const quotaPagata = socio.pagamento_iscrizione_2627 === true;

                const div = document.createElement('div');
                div.className = "bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl space-y-0";
                div.innerHTML = `
                    <!-- Header Profilo -->
                    <div class="bg-slate-700/30 p-5 border-b border-slate-700">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-white text-lg">${socio.nome} ${socio.cognome}</h4>
                                <span class="text-[10px] px-2 py-0.5 bg-cyan-600/20 text-cyan-400 rounded-full font-bold uppercase tracking-wider border border-cyan-600/30">
                                    ${socio.corso_scelto || 'N/D'}
                                </span>
                            </div>
                            <span class="text-[10px] text-slate-500 font-mono tracking-tighter">${socio.codice_fiscale || 'N/D'}</span>
                        </div>
                    </div>

                    <!-- Indicatori di Stato -->
                    <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-3">
                        <!-- Stato Iscrizione -->
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-center">
                            <span class="text-[8px] font-bold text-slate-500 uppercase mb-1">Stato Iscrizione</span>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid ${iscrizioneConfermata ? 'fa-circle-check text-green-500' : 'fa-clock text-amber-500'} text-xs"></i>
                                <span class="text-[10px] font-extrabold ${iscrizioneConfermata ? 'text-green-400' : 'text-amber-400'} uppercase">
                                    ${iscrizioneConfermata ? 'Attiva' : 'In Approvazione'}
                                </span>
                            </div>
                        </div>
                        <!-- Quota A.A. 26/27 -->
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-center">
                            <span class="text-[8px] font-bold text-slate-500 uppercase mb-1">Quota Iscrizione 26/27</span>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid ${quotaPagata ? 'fa-receipt text-green-500' : 'fa-triangle-exclamation text-red-500'} text-xs"></i>
                                <span class="text-[10px] font-extrabold ${quotaPagata ? 'text-green-400' : 'text-red-400'} uppercase">
                                    ${quotaPagata ? 'Versata' : 'Non Versata'}
                                </span>
                            </div>
                        </div>
                        <!-- Certificato Medico -->
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-center">
                            <span class="text-[8px] font-bold text-slate-500 uppercase mb-1">Certificato Medico</span>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid ${medScaduto ? 'fa-ban text-red-500' : 'fa-heart-pulse text-green-500'} text-xs"></i>
                                <span class="text-[10px] font-extrabold ${medScaduto ? 'text-red-400' : 'text-green-400'} uppercase">
                                    ${medScaduto ? 'Scaduto/Assente' : 'In Regola'}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Sezione Azioni Documenti -->
                    <div class="p-5 border-t border-slate-700/50 space-y-4">
                        <h5 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i class="fa-solid fa-file-arrow-up text-cyan-500"></i> Carica Documentazione
                        </h5>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Upload Certificato -->
                            <div class="space-y-2">
                                <label class="block text-[9px] font-bold text-slate-500 uppercase">Certificato Medico</label>
                                <input type="date" id="scadenza_${socio.id}" value="${socio.scadenza_certificato_medico || ''}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none mb-2">
                                <input type="file" id="fileCert_${socio.id}" accept="image/*,.pdf" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-bold file:bg-slate-700 file:text-white cursor-pointer mb-2">
                                <button onclick="uploadCertificato('${socio.id}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-[9px] transition uppercase tracking-wider">
                                    Aggiorna Certificato
                                </button>
                            </div>

                            <!-- Invio Pagamento -->
                            <div class="space-y-2">
                                <label class="block text-[9px] font-bold text-slate-500 uppercase">Versamento Quota Iscrizione</label>
                                <select id="metodo_${socio.id}" onchange="toggleFilePaga('${socio.id}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none mb-2">
                                    <option value="bonifico">Bonifico Bancario</option>
                                    <option value="contanti">Contanti / Manuale</option>
                                </select>
                                <div id="container_file_paga_${socio.id}">
                                    <input type="file" id="filePaga_${socio.id}" accept="image/*,.pdf" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-bold file:bg-emerald-700 file:text-white cursor-pointer mb-2">
                                </div>
                                <button onclick="inviaRichiestaPagamento('${socio.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-[9px] transition uppercase tracking-wider shadow-lg">
                                    Conferma Pagamento
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleFilePaga(socioId) {
            const metodo = document.getElementById(`metodo_${socioId}`).value;
            const container = document.getElementById(`container_file_paga_${socioId}`);
            if (metodo === 'contanti') {
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
            }
        }

        async function uploadCertificato(socioId) {
            const fileInput = document.getElementById(`fileCert_${socioId}`);
            const dataScadenza = document.getElementById(`scadenza_${socioId}`).value;

            if (!fileInput.files.length || !dataScadenza) {
                alert("Seleziona il file del certificato e inserisci la data di scadenza.");
                return;
            }

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `cert_${socioId}_${Date.now()}.${fileExt}`;
            const filePath = `certificati/${fileName}`;

            try {
                const { error: storageError } = await supabaseClient.storage
                    .from('certificati')
                    .upload(filePath, file);

                if (storageError) throw storageError;

                const { data: publicUrlData } = supabaseClient.storage
                    .from('certificati')
                    .getPublicUrl(filePath);

                const { error: updateError } = await supabaseClient
                    .from('soci')
                    .update({
                        certificato_medico_url: publicUrlData.publicUrl,
                        scadenza_certificato_medico: dataScadenza
                    })
                    .eq('id', socioId);

                if (updateError) throw updateError;

                alert("Certificato caricato con successo!");
                
                // Aggiorna i dati locali
                const { data: updatedData } = await supabaseClient.from('soci').select('*').eq('email', foundSociList[0].email);
                if (updatedData) {
                    foundSociList = updatedData;
                    localStorage.setItem('foundSociList', JSON.stringify(foundSociList));
                }
                location.reload();
            } catch (err) {
                alert("Errore: " + err.message);
            }
        }

        async function inviaRichiestaPagamento(socioId) {
            const metodo = document.getElementById(`metodo_${socioId}`).value;
            const fileInput = document.getElementById(`filePaga_${socioId}`);
            
            let ricevutaUrl = null;

            if (metodo === 'bonifico') {
                if (!fileInput.files.length) {
                    alert("Per il bonifico è obbligatorio caricare lo screenshot o il PDF della contabile.");
                    return;
                }

                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `paga_${socioId}_${Date.now()}.${fileExt}`;
                const filePath = `pagamenti/${fileName}`;

                try {
                    const { error: storageError } = await supabaseClient.storage
                        .from('certificati')
                        .upload(filePath, file);

                    if (storageError) throw storageError;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('certificati')
                        .getPublicUrl(filePath);
                    
                    ricevutaUrl = publicUrlData.publicUrl;
                } catch (err) {
                    alert("Errore upload: " + err.message);
                    return;
                }
            }

            try {
                // Registra nella tabella pagamenti (tipologia Iscrizione)
                const { error } = await supabaseClient
                    .from('pagamenti')
                    .insert([{
                        socio_id: socioId,
                        importo: 0, 
                        metodo: metodo,
                        ricevuta_url: ricevutaUrl,
                        stato: 'In attesa di verifica',
                        data_pagamento: new Date().toISOString().split('T')[0],
                        corso: 'Iscrizione Annuale'
                    }]);

                if (error) throw error;

                alert("Richiesta inviata! L'amministrazione verificherà il pagamento e attiverà l'iscrizione.");
                
                // Aggiorna i dati locali
                const { data: updatedData } = await supabaseClient.from('soci').select('*').eq('email', foundSociList[0].email);
                if (updatedData) {
                    foundSociList = updatedData;
                    localStorage.setItem('foundSociList', JSON.stringify(foundSociList));
                }
                location.reload();
            } catch (err) {
                alert("Errore: " + err.message);
            }
        }

        // Controllo Sessione all'avvio
        if (localStorage.getItem('foundSociList')) {
            foundSociList = JSON.parse(localStorage.getItem('foundSociList'));
            renderPortal();
        }
    </script>
</body>
</html>
