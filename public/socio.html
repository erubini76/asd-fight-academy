<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.D. Fight Academy - Area Riservata Tesserati</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center font-sans">

    <div class="container mx-auto max-w-2xl w-full">
        <header class="mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-600 p-2 rounded-xl text-white"><i class="fa-solid fa-id-card"></i></div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight uppercase leading-tight">Area Tesserati</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Portale Tesseramento e Pagamenti</p>
                </div>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </header>

        <main class="space-y-6">
            <!-- LOGIN SICURO -->
            <section id="searchSection" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <div class="text-center mb-4"><h2 class="text-xl font-bold text-white uppercase tracking-tight">Accedi al tuo Profilo Tesserato</h2><p class="text-xs text-slate-400 mt-1 italic">Gestisci i tuoi dati, il certificato medico e i pagamenti del tesseramento.</p></div>
                <div class="space-y-4">
                    <input type="email" id="userEmail" placeholder="Email Registrata" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:ring-2 focus:ring-cyan-500 transition">
                    <input type="text" id="userCf" placeholder="Codice Fiscale" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm uppercase text-white outline-none focus:ring-2 focus:ring-cyan-500 transition font-mono tracking-widest">
                    <button onclick="cercaTesserato()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2 uppercase tracking-wider"><i class="fa-solid fa-lock"></i> Accedi</button>
                </div>
            </section>

            <!-- PORTALE PORTALE -->
            <div id="portalSection" class="hidden space-y-6">
                <div id="profiliContainer" class="space-y-6"></div>
                <button onclick="logoutTesserato()" class="w-full text-center text-[10px] text-slate-500 hover:text-slate-300 transition mt-4 font-bold uppercase tracking-[0.2em]"><i class="fa-solid fa-right-from-bracket mr-2"></i> Esci / Cambia Profilo</button>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let foundTesseratiList = [];

        function getCorsiPerSocio(socio) {
            const iscrizioni = Array.isArray(socio?.iscrizioni_corsi) ? socio.iscrizioni_corsi : [];
            if (iscrizioni.length === 0) {
                return [{ nome_corso: 'N/D', data_iscrizione: null, stato: null }];
            }
            return iscrizioni.slice().sort((a, b) => new Date(b.data_iscrizione || 0) - new Date(a.data_iscrizione || 0));
        }

        async function cercaTesserato() {
            const email = document.getElementById('userEmail').value.trim().toLowerCase(), cf = document.getElementById('userCf').value.trim().toUpperCase();
            if (!email || !cf) { alert("Dati mancanti."); return; }
            try {
                const { data, error } = await supabaseClient
                    .from('soci')
                    .select('*')
                    .eq('email', email);

                if (error) throw error;
                if (!data || data.length === 0) { alert("Nessun tesserato trovato."); return; }
                if (!data.some(s => (s.codice_fiscale || '').toUpperCase() === cf)) { alert("CF non corrispondente."); return; }

                const socioIds = data.map(s => s.id);
                const { data: iscrizioni, error: iscrizioniError } = await supabaseClient
                    .from('iscrizioni_corsi')
                    .select('socio_id, nome_corso, stato, data_iscrizione')
                    .in('socio_id', socioIds);

                if (iscrizioniError) throw iscrizioniError;

                foundTesseratiList = data.map(s => ({
                    ...s,
                    iscrizioni_corsi: (iscrizioni || []).filter(i => i.socio_id === s.id),
                    corso_scelto: getCorsiPerSocio({ ...s, iscrizioni_corsi: (iscrizioni || []).filter(i => i.socio_id === s.id) })[0]?.nome_corso || 'N/D'
                }));


                localStorage.setItem('foundTesseratiList', JSON.stringify(foundTesseratiList));
                renderPortal();
            } catch (err) { alert(err.message); }
        }

        function logoutTesserato() { localStorage.removeItem('foundTesseratiList'); location.reload(); }

        function renderPortal() {
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');
            const container = document.getElementById('profiliContainer');
            container.innerHTML = '';
            foundTesseratiList.forEach(s => {
                const corsoDisplay = getCorsiPerSocio(s)[0]?.nome_corso || 'N/D';
                const medScad = !s.scadenza_certificato_medico || new Date(s.scadenza_certificato_medico) < new Date();
                const tr = document.createElement('div');
                tr.className = "bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl";
                tr.innerHTML = `
                    <div class="bg-slate-700/30 p-5 border-b border-slate-700 flex justify-between items-center">
                        <div><h4 class="font-bold text-white text-lg">${s.nome} ${s.cognome}</h4><span class="text-[9px] px-2 py-0.5 bg-cyan-600/20 text-cyan-400 rounded-full font-bold uppercase border border-cyan-600/30">${corsoDisplay}</span></div>
                        <span class="text-[9px] text-slate-500 font-mono">${s.codice_fiscale || ''}</span>
                    </div>
                    <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-center"><span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Tesseramento</span><span class="text-[9px] font-black ${s.stato_approvazione === 'Approvato' ? 'text-green-400' : 'text-amber-400'} uppercase">${s.stato_approvazione || 'In Approvazione'}</span></div>
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-center"><span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Quota Tesseramento</span><span class="text-[9px] font-black ${s.pagamento_iscrizione_2627 ? 'text-green-400' : 'text-red-400'} uppercase">${s.pagamento_iscrizione_2627 ? 'Pagata' : 'Da Versare'}</span></div>
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-center"><span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Certificato</span><span class="text-[9px] font-black ${medScad ? 'text-red-400' : 'text-green-400'} uppercase">${medScad ? 'Scaduto' : 'In Regola'}</span></div>
                    </div>
                    <div class="p-5 border-t border-slate-700/50 space-y-6">
                        <div class="bg-slate-900/30 p-4 rounded-xl border border-slate-700/50">
                            <h5 class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-2 mb-4 font-black"><i class="fa-solid fa-credit-card"></i> Invia Pagamento</h5>
                            <div class="space-y-4">
                                <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Cosa stai pagando?</label>
                                    <select id="tipo_paga_${s.id}" onchange="updatePayFields('${s.id}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none">
                                        <option value="Iscrizione Annuale">Quota Tesseramento Annuale</option>
                                        <option value="Mensilità">Mese Singolo</option>
                                        <option value="Tranche">Tranche (Più mesi anticipati)</option>
                                        <option value="Lezione Singola">Lezione Singola</option>
                                    </select>
                                </div>
                                <div id="container_periodo_${s.id}" class="hidden grid grid-cols-2 gap-2">
                                    <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Dal Mese</label>
                                        <select id="mese_${s.id}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none">
                                            <option value="9">Settembre</option><option value="10">Ottobre</option><option value="11">Novembre</option><option value="12">Dicembre</option><option value="1">Gennaio</option><option value="2">Febbraio</option><option value="3">Marzo</option><option value="4">Aprile</option><option value="5">Maggio</option><option value="6">Giugno</option><option value="7">Luglio</option><option value="8">Agosto</option>
                                        </select>
                                    </div>
                                    <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Anno</label>
                                        <select id="anno_${s.id}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none"><option value="2026">2026</option><option value="2027">2027</option></select>
                                    </div>
                                </div>
                                <div id="container_tranche_${s.id}" class="hidden"><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Numero di Mesi</label><input type="number" id="num_mesi_${s.id}" value="3" min="2" max="12" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none"></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Metodo</label>
                                        <select id="metodo_${s.id}" onchange="toggleFilePaga('${s.id}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none"><option value="bonifico">Bonifico</option><option value="contanti">Contanti</option></select>
                                    </div>
                                    <div id="container_file_paga_${s.id}"><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Ricevuta</label><input type="file" id="filePaga_${s.id}" accept="image/*,.pdf" class="w-full text-[9px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-emerald-700 file:text-white cursor-pointer mt-1"></div>
                                </div>
                                <button onclick="inviaPagamentoAvanzato('${s.id}', '${corsoDisplay.replace(/'/g, "\\'")}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-[10px] transition uppercase tracking-widest shadow-xl">Conferma Operazione</button>
                            </div>
                        </div>
                        <div class="bg-slate-900/30 p-4 rounded-xl border border-slate-700/50">
                            <h5 class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest flex items-center gap-2 mb-3"><i class="fa-solid fa-stethoscope"></i> Aggiorna Certificato</h5>
                            <input type="date" id="scadenza_${s.id}" value="${s.scadenza_certificato_medico || ''}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none mb-2">
                            <input type="file" id="fileCert_${s.id}" accept="image/*,.pdf" class="w-full text-[9px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-700 file:text-white cursor-pointer mb-2">
                            <button onclick="uploadCertificato('${s.id}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-[10px] transition uppercase tracking-widest border border-slate-600">Carica Documento</button>
                        </div>
                    </div>
                `;
                container.appendChild(tr);
            });
        }

        function updatePayFields(id) {
            const t = document.getElementById(`tipo_paga_${id}`).value;
            document.getElementById(`container_periodo_${id}`).classList.toggle('hidden', t === 'Iscrizione Annuale' || t === 'Lezione Singola');
            document.getElementById(`container_tranche_${id}`).classList.toggle('hidden', t !== 'Tranche');
        }

        function toggleFilePaga(id) {
            const m = document.getElementById(`metodo_${id}`).value;
            document.getElementById(`container_file_paga_${id}`).classList.toggle('hidden', m === 'contanti');
        }

        async function inviaPagamentoAvanzato(tesseratoId, corsoSocio, cardKey = tesseratoId) {
            const btn = event.target; // Prendi il bottone che ha scatenato l'evento
            const tipo = document.getElementById(`tipo_paga_${cardKey}`).value;
            const metodo = document.getElementById(`metodo_${cardKey}`).value;
            const file = document.getElementById(`filePaga_${cardKey}`).files[0];
            let url = null;
            
            // Disabilita bottone durante l'invio
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Elaborazione...';
            const originalText = 'Conferma Operazione';

            if (metodo === 'bonifico') {
                if (!file) { alert("Allega ricevuta."); return; }
                const fileName = `p_${tesseratoId}_${Date.now()}.${file.name.split('.').pop()}`;
                const { error: e } = await supabaseClient.storage.from('ricevute_pagamenti').upload(fileName, file);
                if (e) { alert(e.message); return; }
                url = supabaseClient.storage.from('ricevute_pagamenti').getPublicUrl(fileName).data.publicUrl;
            }

            const baseRecord = { socio_id: tesseratoId, metodo, ricevuta_url: url, stato: 'In attesa di verifica', data_pagamento: new Date().toISOString().split('T')[0], importo: 0, importo_totale: 0, corso: corsoSocio || 'Generale' };
            const records = [];

            if (tipo === 'Mensilità' || tipo === 'Tranche') {
                const startM = parseInt(document.getElementById(`mese_${cardKey}`).value);
                const startA = parseInt(document.getElementById(`anno_${cardKey}`).value);
                const num = tipo === 'Tranche' ? parseInt(document.getElementById(`num_mesi_${cardKey}`).value) : 1;
                for(let i=0; i<num; i++) {
                    let m = startM + i, a = startA; if(m > 12) { m -= 12; a++; }
                    records.push({ ...baseRecord, mese_riferimento: m, anno_riferimento: a, tipo_pagamento: 'Mensilità', periodo_riferimento: `Mese ${m}/${a}` });
                }
            } else {
                records.push({ ...baseRecord, corso: tipo === 'Iscrizione Annuale' ? 'Iscrizione Annuale' : corsoSocio, tipo_pagamento: tipo, periodo_riferimento: tipo === 'Iscrizione Annuale' ? 'A.A. 2026/2027' : 'Ingresso' });
            }

            try {
                const { error } = await supabaseClient.from('pagamenti').upsert(records, { onConflict: 'socio_id,mese_riferimento,anno_riferimento,corso' });
                if (error) throw error;
                alert("Richiesta inviata!"); location.reload();
            } catch (e) { alert(e.message); }
            finally {
                // Re-abilita bottone
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-credit-card"></i> Conferma Operazione';
            }
        }

        async function uploadCertificato(tesseratoId) {
            const f = document.getElementById(`fileCert_${tesseratoId}`).files[0], d = document.getElementById(`scadenza_${tesseratoId}`).value;
            if (!f || !d) { alert("Dati mancanti."); return; }
            const fileName = `c_${tesseratoId}_${Date.now()}.${f.name.split('.').pop()}`;
            try {
                await supabaseClient.storage.from('certificati_medici').upload(fileName, f);
                const url = supabaseClient.storage.from('certificati_medici').getPublicUrl(fileName).data.publicUrl;
                await supabaseClient.from('soci').update({ certificato_medico_url: url, scadenza_certificato_medico: d }).eq('id', tesseratoId);
                alert("Certificato caricato!"); location.reload();
            } catch (e) { alert(e.message); }
        }

        if (localStorage.getItem('foundTesseratiList')) { foundTesseratiList = JSON.parse(localStorage.getItem('foundTesseratiList')); renderPortal(); }
    </script>
</body>
</html>
