<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center font-sans">

    <div class="container mx-auto max-w-2xl w-full">
        <header class="mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-600 p-2 rounded-xl text-white"><i class="fa-solid fa-id-card"></i></div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight uppercase leading-tight">Area Tesserati</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Portale Tesseramento e Pagamenti</p>
                </div>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </header>

        <main class="space-y-6">
            <!-- LOGIN SICURO -->
            <section id="searchSection" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <div class="text-center mb-4"><h2 class="text-xl font-bold text-white uppercase tracking-tight">Accedi al tuo Profilo Tesserato</h2><p class="text-xs text-slate-400 mt-1 italic">Gestisci i tuoi dati, il certificato medico e i pagamenti del tesseramento.</p></div>
                <div class="space-y-4">
                    <input type="email" id="userEmail" placeholder="Email Registrata" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:ring-2 focus:ring-cyan-500 transition">
                    <input type="text" id="userCf" placeholder="Codice Fiscale" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm uppercase text-white outline-none focus:ring-2 focus:ring-cyan-500 transition font-mono tracking-widest">
                    <button onclick="cercaTesserato()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2 uppercase tracking-wider"><i class="fa-solid fa-lock"></i> Accedi</button>
                </div>
            </section>

            <!-- PORTALE PORTALE -->
            <div id="portalSection" class="hidden space-y-6">
                <div id="profiliContainer" class="space-y-6"></div>
                <button onclick="logoutTesserato()" class="w-full text-center text-[10px] text-slate-500 hover:text-slate-300 transition mt-4 font-bold uppercase tracking-[0.2em]"><i class="fa-solid fa-right-from-bracket mr-2"></i> Esci / Cambia Profilo</button>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let foundTesseratiList = [];

        function getAnnoAccademico(data = new Date()) {
            const anno = data.getFullYear();
            const inizioStagione = new Date(anno, 7, 1);
            const annoInizio = data >= inizioStagione ? anno : anno - 1;
            return `${annoInizio}/${annoInizio + 1}`;
        }

        function formatDataItaliana(value) {
            if (!value) return '';
            const [anno, mese, giorno] = String(value).slice(0, 10).split('-');
            return anno && mese && giorno ? `${giorno}-${mese}-${anno}` : value;
        }

        function parseDataItaliana(value) {
            const match = String(value || '').trim().match(/^(\d{2})-(\d{2})-(\d{4})$/);
            if (!match) return null;
            const [, giorno, mese, anno] = match;
            const data = new Date(Number(anno), Number(mese) - 1, Number(giorno));
            return data.getFullYear() === Number(anno) && data.getMonth() === Number(mese) - 1 && data.getDate() === Number(giorno)
                ? `${anno}-${mese}-${giorno}`
                : null;
        }

        // Inserisce automaticamente i trattini GG-MM-AAAA: sui tastierini numerici (iPhone/Android) il trattino non è digitabile
        document.addEventListener('input', (e) => {
            if (!e.target.matches('input[placeholder="GG-MM-AAAA"]')) return;
            const cifre = e.target.value.replace(/\D/g, '').slice(0, 8);
            e.target.value = cifre.length > 4
                ? `${cifre.slice(0, 2)}-${cifre.slice(2, 4)}-${cifre.slice(4)}`
                : cifre.length > 2
                    ? `${cifre.slice(0, 2)}-${cifre.slice(2)}`
                    : cifre;
        });

        function getAnnoAccademicoDaMese(mese, anno) {
            const annoInizio = mese >= 8 ? anno : anno - 1;
            return `${annoInizio}/${annoInizio + 1}`;
        }

        function getDataConservazioneCertificato(annoAccademico) {
            const annoFine = Number(annoAccademico.slice(5, 9));
            return `${annoFine + 10}-08-31`;
        }

        function getCorsiPerSocio(socio) {
            const iscrizioni = Array.isArray(socio?.iscrizioni_annuali) ? socio.iscrizioni_annuali : [];
            if (iscrizioni.length === 0) {
                return [{
                    nome_corso: socio?.is_istruttore ? 'Istruttore' : 'N/D',
                    data_invio: null,
                    stato: socio?.is_istruttore ? 'Attivo' : null,
                    solo_istruttore: Boolean(socio?.is_istruttore)
                }];
            }
            return iscrizioni.slice().sort((a, b) => new Date(b.data_invio || 0) - new Date(a.data_invio || 0));
        }

        async function cercaTesserato() {
            const email = document.getElementById('userEmail').value.trim().toLowerCase(), cf = document.getElementById('userCf').value.trim().toUpperCase();
            if (!email || !cf) { alert("Dati mancanti."); return; }
            try {
                const { data, error } = await supabaseClient
                    .from('soci')
                    .select('*')
                    .eq('email', email);

                if (error) throw error;
                if (!data || data.length === 0) { alert("Nessun tesserato trovato."); return; }
                if (!data.some(s => (s.codice_fiscale || '').toUpperCase() === cf)) { alert("CF non corrispondente."); return; }

                const socioIds = data.map(s => s.id);
                const { data: iscrizioni, error: iscrizioniError } = await supabaseClient
                    .from('iscrizioni_corsi')
                    .select('socio_id, nome_corso, stato, data_iscrizione')
                    .in('socio_id', socioIds);

                if (iscrizioniError) throw iscrizioniError;

                const annoAccademico = getAnnoAccademico();
                const { data: annualita, error: annualitaError } = await supabaseClient
                    .from('iscrizioni_annuali')
                    .select('*')
                    .in('socio_id', socioIds)
                    .eq('anno_accademico', annoAccademico);
                if (annualitaError) throw annualitaError;

                const { data: documentiMedici, error: documentiError } = await supabaseClient
                    .from('documenti_medici')
                    .select('*')
                    .in('socio_id', socioIds)
                    .eq('anno_accademico', annoAccademico)
                    .eq('attivo', true)
                    .is('eliminato_il', null);
                if (documentiError) throw documentiError;

                const { data: consensi, error: consensiError } = await supabaseClient
                    .from('consensi_tesseramento')
                    .select('*')
                    .in('socio_id', socioIds)
                    .eq('anno_accademico', annoAccademico)
                    .order('registrato_il', { ascending: false });
                if (consensiError) throw consensiError;

                const { data: pagamenti, error: pagamentiError } = await supabaseClient
                    .from('pagamenti')
                    .select('*')
                    .in('socio_id', socioIds)
                    .eq('anno_accademico', annoAccademico);

                if (pagamentiError) throw pagamentiError;

                const { data: incarichiIstruttore, error: istruttoriError } = await supabaseClient
                    .from('istruttori_corsi')
                    .select('socio_id, ruolo')
                    .in('socio_id', socioIds)
                    .eq('ruolo', 'istruttore');
                if (istruttoriError) throw istruttoriError;

                const istruttoriSocioIds = new Set((incarichiIstruttore || []).map(i => i.socio_id));

                foundTesseratiList = data.map(s => ({
                    ...s,
                    iscrizioni_corsi: (iscrizioni || []).filter(i => i.socio_id === s.id),
                    iscrizioni_annuali: (annualita || []).filter(i => i.socio_id === s.id),
                    pagamenti_annuali: (pagamenti || []).filter(p => p.socio_id === s.id),
                    documento_medico_corrente: (documentiMedici || []).find(d => d.socio_id === s.id) || null,
                    consensi_correnti: (consensi || []).filter(c => c.socio_id === s.id),
                    is_istruttore: istruttoriSocioIds.has(s.id),
                    anno_accademico: annoAccademico
                }));


                localStorage.setItem('foundTesseratiList', JSON.stringify(foundTesseratiList));
                renderPortal();
            } catch (err) { alert(err.message); }
        }

        function logoutTesserato() { localStorage.removeItem('foundTesseratiList'); location.reload(); }

        function renderPortal() {
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');
            const container = document.getElementById('profiliContainer');
            container.innerHTML = '';
            foundTesseratiList.forEach(s => {
                const corsi = getCorsiPerSocio(s);
                // Una scheda per ogni corso: i pagamenti vanno divisi per corso, non per tesserato.
                corsi.forEach((corsoObj, idx) => {
                    const cardKey = `${s.id}_${idx}`;
                    const corsoDisplay = corsoObj.nome_corso || 'N/D';
                    const quota = (s.pagamenti_annuali || []).find(p => p.tipo_pagamento === 'Iscrizione Annuale') || null;
                    const quotaApprovata = quota?.stato === 'Approvato';
                    const quotaInVerifica = quota?.stato === 'In attesa di verifica';
                    const documentoMedico = s.documento_medico_corrente;
                    const medScad = !documentoMedico?.scadenza || new Date(documentoMedico.scadenza) < new Date();
                    const soloIstruttore = Boolean(corsoObj.solo_istruttore);
                    const privacy = (s.consensi_correnti || []).find(c => c.tipo === 'presa_visione_privacy');
                    const foto = (s.consensi_correnti || []).find(c => c.tipo === 'foto_video');
                    const tr = document.createElement('div');
                    tr.className = "bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl";
                    tr.innerHTML = `
                        <div class="bg-slate-700/30 p-5 border-b border-slate-700 flex justify-between items-center">
                            <div><h4 class="font-bold text-white text-lg">${s.nome} ${s.cognome}</h4><span class="text-[9px] px-2 py-0.5 bg-cyan-600/20 text-cyan-400 rounded-full font-bold uppercase border border-cyan-600/30">${corsoDisplay}</span></div>
                            <span class="text-[9px] text-slate-500 font-mono">${s.codice_fiscale || ''}</span>
                        </div>
                        <div class="px-5 pt-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="bg-slate-900/50 p-3 rounded-xl border ${privacy?.stato === 'dato' ? 'border-green-500/30' : 'border-amber-500/30'} text-center">
                                <span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Privacy</span>
                                <span class="text-[9px] font-black ${privacy?.stato === 'dato' ? 'text-green-400' : 'text-amber-400'} uppercase"><i class="fa-solid ${privacy?.stato === 'dato' ? 'fa-check' : 'fa-triangle-exclamation'} mr-1"></i>${privacy?.stato === 'dato' ? 'Registrata' : 'Non registrata'}</span>
                            </div>
                            <div class="bg-slate-900/50 p-3 rounded-xl border ${foto?.stato === 'dato' ? 'border-green-500/30' : 'border-amber-500/30'} text-center">
                                <span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Foto / Immagini</span>
                                <span class="text-[9px] font-black ${foto?.stato === 'dato' ? 'text-green-400' : 'text-amber-400'} uppercase"><i class="fa-solid ${foto?.stato === 'dato' ? 'fa-check' : 'fa-minus'} mr-1"></i>${foto?.stato === 'dato' ? 'Consenso dato' : 'Consenso non dato'}</span>
                            </div>
                        </div>
                        <div class="mx-5 mt-5 bg-slate-900/30 p-4 rounded-xl border border-slate-700/50">
                            <h5 class="text-[10px] font-bold text-white uppercase tracking-widest flex items-center gap-2 mb-3"><i class="fa-solid fa-address-card text-cyan-400"></i> Dati anagrafici</h5>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2 text-[10px]">
                                <div><span class="text-[8px] font-bold text-slate-500 uppercase block">Data di nascita</span><span class="text-slate-200">${s.data_nascita || 'Non indicata'}</span></div>
                                <div><span class="text-[8px] font-bold text-slate-500 uppercase block">Luogo di nascita</span><span class="text-slate-200">${s.luogo_nascita || 'Non indicato'}</span></div>
                                <div><span class="text-[8px] font-bold text-slate-500 uppercase block">Email</span><span class="text-slate-200 break-all">${s.email || 'Non indicata'}</span></div>
                                <div><span class="text-[8px] font-bold text-slate-500 uppercase block">Telefono</span><span class="text-slate-200">${s.telefono || 'Non indicato'}</span></div>
                                <div class="sm:col-span-2"><span class="text-[8px] font-bold text-slate-500 uppercase block">Residenza</span><span class="text-slate-200">${[s.residenza_indirizzo, s.residenza_cap, s.residenza_citta].filter(Boolean).join(', ') || 'Non indicata'}</span></div>
                                ${(s.nome_tutore || s.cognome_tutore || s.cf_tutore) ? `<div class="sm:col-span-2"><span class="text-[8px] font-bold text-slate-500 uppercase block">Genitore / Tutore</span><span class="text-slate-200">${[s.nome_tutore, s.cognome_tutore].filter(Boolean).join(' ')}${s.cf_tutore ? ` · CF ${s.cf_tutore}` : ''}</span></div>` : ''}
                            </div>
                        </div>
                        <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-center"><span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">${soloIstruttore ? 'Incarico istruttore' : `Tesseramento ${s.anno_accademico}`}</span><span class="text-[9px] font-black ${soloIstruttore || corsoObj.stato === 'Approvato' ? 'text-green-400' : 'text-amber-400'} uppercase">${soloIstruttore ? 'Attivo' : (corsoObj.stato || 'In Attesa')}</span></div>
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-center"><span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Quota Tesseramento</span><span class="text-[9px] font-black ${soloIstruttore || quotaApprovata ? 'text-green-400' : (quotaInVerifica ? 'text-amber-400' : 'text-red-400')} uppercase">${soloIstruttore ? 'Non dovuta' : (quotaApprovata ? 'Pagata' : (quotaInVerifica ? 'In verifica' : 'Da versare'))}</span></div>
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-center"><span class="text-[7px] font-bold text-slate-500 uppercase block mb-1">Certificato</span><span class="text-[9px] font-black ${medScad ? 'text-red-400' : 'text-green-400'} uppercase">${medScad ? 'Scaduto' : 'In Regola'}</span></div>
                        </div>
                        <div class="p-5 border-t border-slate-700/50 space-y-6">
                            ${!soloIstruttore ? `<div class="bg-slate-900/30 p-4 rounded-xl border border-slate-700/50">
                                <h5 class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-2 mb-4 font-black"><i class="fa-solid fa-credit-card"></i> Invia Pagamento</h5>
                                <div class="space-y-4">
                                    <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Cosa stai pagando?</label>
                                        <select id="tipo_paga_${cardKey}" onchange="updatePayFields('${cardKey}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none">
                                            <option value="Iscrizione Annuale">Quota Tesseramento Annuale</option>
                                            <option value="Mensilità">Mese Singolo</option>
                                            <option value="Tranche">Tranche (Più mesi anticipati)</option>
                                            <option value="Lezione Singola">Lezione Singola</option>
                                        </select>
                                    </div>
                                    <div id="container_periodo_${cardKey}" class="hidden grid grid-cols-2 gap-2">
                                        <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Dal Mese</label>
                                            <select id="mese_${cardKey}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none">
                                                <option value="9">Settembre</option><option value="10">Ottobre</option><option value="11">Novembre</option><option value="12">Dicembre</option><option value="1">Gennaio</option><option value="2">Febbraio</option><option value="3">Marzo</option><option value="4">Aprile</option><option value="5">Maggio</option><option value="6">Giugno</option><option value="7">Luglio</option><option value="8">Agosto</option>
                                            </select>
                                        </div>
                                        <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Anno</label>
                                            <select id="anno_${cardKey}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none"><option value="2026">2026</option><option value="2027">2027</option></select>
                                        </div>
                                    </div>
                                    <div id="container_tranche_${cardKey}" class="hidden"><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Numero di Mesi</label><input type="number" id="num_mesi_${cardKey}" value="3" min="2" max="12" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none"></div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Metodo</label>
                                            <select id="metodo_${cardKey}" onchange="toggleFilePaga('${cardKey}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none"><option value="bonifico">Bonifico</option><option value="contanti">Contanti</option></select>
                                        </div>
                                        <div>
                                            <label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Importo (&euro;)</label>
                                            <input type="number" id="importo_${cardKey}" value="0" min="0" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-[10px] text-white outline-none">
                                        </div>
                                    </div>
                                    <div id="container_file_paga_${cardKey}"><label class="block text-[8px] font-bold text-slate-500 uppercase mb-1">Ricevuta</label><input type="file" id="filePaga_${cardKey}" accept="image/*,.pdf" class="w-full text-[9px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-emerald-700 file:text-white cursor-pointer mt-1"></div>
                                    <button onclick="inviaPagamentoAvanzato('${s.id}', '${corsoDisplay.replace(/'/g, "\\'")}', '${s.anno_accademico}', '${cardKey}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-[10px] transition uppercase tracking-widest shadow-xl"><i class="fa-solid fa-credit-card"></i> Conferma Operazione</button>
                                </div>
                            </div>` : ''}
                            ${idx === 0 ? `
                            <div class="bg-slate-900/30 p-4 rounded-xl border border-slate-700/50">
                                <h5 class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest flex items-center gap-2 mb-3"><i class="fa-solid fa-file-pdf"></i> Regolamento Pagamenti</h5>
                                <p class="text-[10px] text-slate-400 mb-3">Anno associativo</p>
                                <button id="btn-regolamento_${cardKey}" onclick="scaricaRegolamento('${s.id}', '${cardKey}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-[10px] transition uppercase tracking-widest border border-slate-600"><i class="fa-solid fa-download"></i> Scarica PDF</button>
                            </div>` : ''}
                            <div class="bg-slate-900/30 p-4 rounded-xl border border-slate-700/50">
                                <h5 class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest flex items-center gap-2 mb-3"><i class="fa-solid fa-stethoscope"></i> Aggiorna Certificato</h5>
                                <input type="text" id="scadenza_${cardKey}" placeholder="GG-MM-AAAA" inputmode="numeric" value="${formatDataItaliana(documentoMedico?.scadenza)}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[10px] text-white outline-none mb-2">
                                <input type="file" id="fileCert_${cardKey}" accept="image/*,.pdf" class="w-full text-[9px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-700 file:text-white cursor-pointer mb-2">
                                <button onclick="uploadCertificato('${s.id}', '${s.anno_accademico}', '${cardKey}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-[10px] transition uppercase tracking-widest border border-slate-600">Carica Documento</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(tr);
                });
            });
        }

        function updatePayFields(id) {
            const t = document.getElementById(`tipo_paga_${id}`).value;
            document.getElementById(`container_periodo_${id}`).classList.toggle('hidden', t === 'Iscrizione Annuale' || t === 'Lezione Singola');
            document.getElementById(`container_tranche_${id}`).classList.toggle('hidden', t !== 'Tranche');
        }

        function toggleFilePaga(id) {
            const m = document.getElementById(`metodo_${id}`).value;
            document.getElementById(`container_file_paga_${id}`).classList.toggle('hidden', m === 'contanti');
        }

        async function scaricaRegolamento(socioId, cardKey) {
            const socio = foundTesseratiList.find(item => item.id === socioId);
            const button = document.getElementById(`btn-regolamento_${cardKey}`);
            if (!socio || !button) return;

            const testoOriginale = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Preparazione...';
            try {
                const response = await fetch('/api/regolamento-pagamenti', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        socioId: socio.id,
                        email: socio.email,
                        codiceFiscale: socio.codice_fiscale
                    })
                });
                const responseBody = await response.text();
                let payload;
                try {
                    payload = JSON.parse(responseBody);
                } catch {
                    throw new Error('Il servizio di download non è disponibile. Riprova tra qualche istante.');
                }
                if (!response.ok) throw new Error(payload.error || 'Download non disponibile');
                window.open(payload.url, '_blank', 'noopener');
            } catch (error) {
                alert(error.message);
            } finally {
                button.disabled = false;
                button.innerHTML = testoOriginale;
            }
        }

        async function inviaPagamentoAvanzato(tesseratoId, corsoSocio, annoAccademico, cardKey = tesseratoId) {
            const btn = event.target; // Prendi il bottone che ha scatenato l'evento
            const tipo = document.getElementById(`tipo_paga_${cardKey}`).value;
            const metodo = document.getElementById(`metodo_${cardKey}`).value;
            const importo = Number(document.getElementById(`importo_${cardKey}`).value || 0);
            const file = document.getElementById(`filePaga_${cardKey}`).files[0];
            let url = null;
            
            if (!importo || importo <= 0) {
                alert('Inserisci un importo valido prima di confermare il pagamento.');
                return;
            }

            // Disabilita bottone durante l'invio
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Elaborazione...';
            const originalText = 'Conferma Operazione';

            if (metodo === 'bonifico') {
                if (!file) { alert("Allega ricevuta."); return; }
                const fileName = `p_${tesseratoId}_${Date.now()}.${file.name.split('.').pop()}`;
                // Legge il file come ArrayBuffer per evitare l'errore "No content provided" su alcuni browser mobili
                const fileBuffer = await file.arrayBuffer();
                const { error: e } = await supabaseClient.storage.from('ricevute_pagamenti').upload(fileName, fileBuffer, { contentType: file.type || 'application/octet-stream' });
                if (e) { alert(e.message); return; }
                url = supabaseClient.storage.from('ricevute_pagamenti').getPublicUrl(fileName).data.publicUrl;
            }

            const baseRecord = { socio_id: tesseratoId, metodo, ricevuta_url: url, stato: 'In attesa di verifica', data_pagamento: new Date().toISOString().split('T')[0], importo, importo_totale: importo, corso: corsoSocio || 'Generale' };
            const records = [];

            if (tipo === 'Mensilità' || tipo === 'Tranche') {
                const startM = parseInt(document.getElementById(`mese_${cardKey}`).value);
                const startA = parseInt(document.getElementById(`anno_${cardKey}`).value);
                const num = tipo === 'Tranche' ? parseInt(document.getElementById(`num_mesi_${cardKey}`).value) : 1;
                const importoMensile = Math.round((importo / num) * 100) / 100;
                for(let i=0; i<num; i++) {
                    let m = startM + i, a = startA; if(m > 12) { m -= 12; a++; }
                    records.push({ ...baseRecord, importo: importoMensile, mese_riferimento: m, anno_riferimento: a, anno_accademico: getAnnoAccademicoDaMese(m, a), tipo_pagamento: 'Mensilità', periodo_riferimento: `Mese ${m}/${a}` });
                }
            } else {
                const annoInizio = Number(annoAccademico.slice(0, 4));
                records.push({ ...baseRecord, corso: tipo === 'Iscrizione Annuale' ? 'Iscrizione Annuale' : corsoSocio, anno_accademico: annoAccademico, tipo_pagamento: tipo, periodo_riferimento: tipo === 'Iscrizione Annuale' ? `A.A. ${annoAccademico}` : 'Ingresso', anno_riferimento: tipo === 'Iscrizione Annuale' ? annoInizio : null });
            }

            try {
                const { error } = await supabaseClient.from('pagamenti').upsert(records, { onConflict: 'socio_id,mese_riferimento,anno_riferimento,corso' });
                if (error) throw error;
                alert("Richiesta inviata!"); location.reload();
            } catch (e) { alert(e.message); }
            finally {
                // Re-abilita bottone
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-credit-card"></i> Conferma Operazione';
            }
        }

        async function uploadCertificato(tesseratoId, annoAccademico, cardKey = tesseratoId) {
            const f = document.getElementById(`fileCert_${cardKey}`).files[0], dInput = document.getElementById(`scadenza_${cardKey}`).value, d = parseDataItaliana(dInput);
            if (dInput.trim() && !d) { alert('Data non valida. Usa il formato GG-MM-AAAA.'); return; }
            if (!f || !d) { alert("Dati mancanti."); return; }
            const fileName = `c_${tesseratoId}_${Date.now()}.${f.name.split('.').pop()}`;
            try {
                // Legge il file come ArrayBuffer per evitare l'errore "No content provided" su alcuni browser mobili
                const fileBuffer = await f.arrayBuffer();
                await supabaseClient.storage.from('certificati_medici').upload(fileName, fileBuffer, { contentType: f.type || 'application/octet-stream' });
                const url = supabaseClient.storage.from('certificati_medici').getPublicUrl(fileName).data.publicUrl;
                const { error: disattivaError } = await supabaseClient
                    .from('documenti_medici')
                    .update({ attivo: false })
                    .eq('socio_id', tesseratoId)
                    .eq('anno_accademico', annoAccademico)
                    .eq('attivo', true);
                if (disattivaError) throw disattivaError;

                const { error: documentoError } = await supabaseClient
                    .from('documenti_medici')
                    .insert([{
                        socio_id: tesseratoId,
                        anno_accademico: annoAccademico,
                        file_url: url,
                        nome_file: f.name,
                        scadenza: d,
                        attivo: true,
                        conservare_fino_al: getDataConservazioneCertificato(annoAccademico)
                    }]);
                if (documentoError) throw documentoError;

                const { error: annualitaError } = await supabaseClient
                    .from('iscrizioni_annuali')
                    .update({ certificato_medico_url: url, scadenza_certificato_medico: d })
                    .eq('socio_id', tesseratoId)
                    .eq('anno_accademico', annoAccademico);
                if (annualitaError) throw annualitaError;

                const { error: profiloError } = await supabaseClient
                    .from('soci')
                    .update({ certificato_medico_url: url, scadenza_certificato_medico: d })
                    .eq('id', tesseratoId);
                if (profiloError) throw profiloError;
                alert("Certificato caricato!"); location.reload();
            } catch (e) { alert(e.message); }
        }

        if (localStorage.getItem('foundTesseratiList')) { foundTesseratiList = JSON.parse(localStorage.getItem('foundTesseratiList')); renderPortal(); }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
