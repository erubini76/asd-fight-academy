<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.D. Fight Academy - Pannello Controllo Soci</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto">
    <!-- HEADER PANNELLO -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 mb-6 border-b border-gray-200 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-red-700 tracking-tight">A.S.D. FIGHT ACADEMY</h1>
        <p class="text-sm text-gray-500 font-medium">Pannello Controllo Soci & Registro Presenze (C.F. 91023520280)</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- FILTRO CORSI -->
        <select id="filterCorso" onchange="filterSoci()" class="bg-white border border-gray-300 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-red-600">
          <option value="ALL">Tutti i Corsi</option>
          <option value="Ninjutsu Adulti/Ragazzi">Ninjutsu Adulti/Ragazzi</option>
          <option value="Ninjutsu Bambini">Ninjutsu Bambini</option>
          <option value="Vietvodao Adulti/Ragazzi">Vietvodao Adulti/Ragazzi</option>
          <option value="Vietvodao Bambini">Vietvodao Bambini</option>
          <option value="Shodo (Calligrafia Giapponese)">Shodo (Calligrafia Giapponese)</option>
        </select>

        <!-- PULSANTE ESPORTA CSV -->
        <button onclick="exportCSV()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2 rounded-lg shadow transition duration-150">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Esporta CSV Soci
        </button>
      </div>
    </header>

    <!-- TABELLA SOCI -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-xs font-bold text-gray-500 uppercase tracking-wider border-b border-gray-200">
              <th class="py-3 px-4">SOCIO</th>
              <th class="py-3 px-4">CORSO ASSEGNATO</th>
              <th class="py-3 px-4">CERTIFICATO MEDICO</th>
              <th class="py-3 px-4">TESSERA ASI</th>
              <th class="py-3 px-4 text-center">PRESENZE / ESAMI</th>
              <th class="py-3 px-4 text-center">AZIONI</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="6" class="py-8 text-center text-gray-400 font-medium">Caricamento soci in corso...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Inizializzazione Supabase Client
    const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';[cite: 5]
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';[cite: 6]
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allSoci = [];

    // Caricamento Dati all'avvio
    document.addEventListener('DOMContentLoaded', loadSoci);

    async function loadSoci() {
      try {
        const { data, error } = await supabaseClient
          .from('soci')
          .select('*')
          .order('cognome', { ascending: true });

        if (error) throw error;

        allSoci = data || [];
        renderSoci(allSoci);
      } catch (err) {
        console.error('Errore nel caricamento dei soci:', err);
        document.getElementById('tableBody').innerHTML = `
          <tr>
            <td colspan="6" class="py-8 text-center text-red-500 font-semibold">
              Errore di connessione al database. Riprova più tardi.
            </td>
          </tr>`;
      }
    }

    // Render della Tabella Soci
    function renderSoci(soci) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (soci.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="py-8 text-center text-gray-400 font-medium">Nessun socio trovato per il filtro selezionato.</td>
          </tr>`;
        return;
      }

      const LEZIONI_TOTALI_STIMATE = 60; // 2 lezioni/settimana per l'anno accademico

      soci.forEach(socio => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 transition duration-100";

        // Badge Certificato Medico con pulsante di modifica rapida
        let certBadge = `<div class="flex flex-col gap-1 items-start">`;
        if (socio.scadenza_certificato) {
          const scadenza = new Date(socio.scadenza_certificato);
          const oggi = new Date();
          const diffDays = Math.ceil((scadenza - oggi) / (1000 * 60 * 60 * 24));
          
          if (diffDays < 0) {
            certBadge += `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-red-100 text-red-800">Scaduto (${socio.scadenza_certificato})</span>`;
          } else if (diffDays <= 30) {
            certBadge += `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-amber-100 text-amber-800">In Scadenza (${socio.scadenza_certificato})</span>`;
          } else {
            certBadge += `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-green-100 text-green-800">Valido (${socio.scadenza_certificato})</span>`;
          }
        } else {
          certBadge += `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-gray-100 text-gray-600">Da inserire</span>`;
        }
        certBadge += `<button onclick="modificaCertificato('${socio.id}', '${socio.scadenza_certificato || ''}')" class="text-[10px] bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-0.5 rounded font-medium mt-1">Modifica Cert.</button>`;
        certBadge += `</div>`;

        // Badge Tessera ASI con pulsante di modifica rapida
        let asiBadge = `<div class="flex flex-col gap-1 items-start">`;
        if (socio.tessera_asi) {
          asiBadge += `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-emerald-100 text-emerald-800">N° ${socio.tessera_asi}</span>`;
        } else {
          asiBadge += `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-gray-100 text-gray-600">Da registrare</span>`;
        }
        asiBadge += `<button onclick="modificaAsi('${socio.id}', '${socio.tessera_asi || ''}')" class="text-[10px] bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-0.5 rounded font-medium mt-1">Modifica ASI</button>`;
        asiBadge += `</div>`;

        // Calcolo Idoneità Esame per Corsi Bambini (>70% frequenza)[cite: 2]
        let esameStatusHtml = '';
        if (socio.corso_scelto && socio.corso_scelto.includes('Bambini')) {
          const presenze = socio.presenze_totali || 0;
          const percentuale = Math.round((presenze / LEZIONI_TOTALI_STIMATE) * 100);
          
          if (percentuale >= 70) {
            esameStatusHtml = `<div class="mt-1 text-[11px] font-bold text-green-700 bg-green-50 px-2 py-0.5 rounded border border-green-200">🟢 Idoneo Esame (${percentuale}%)</div>`;
          } else {
            esameStatusHtml = `<div class="mt-1 text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">⚠️ Valutazione Istruttore (${percentuale}%)</div>`;
          }
        }

        tr.innerHTML = `
          <td class="py-3 px-4 font-semibold text-gray-900">
            <div>${socio.nome || ''} ${socio.cognome || ''}</div>
            <div class="text-xs text-gray-400 font-normal">${socio.email || 'Nessuna email'} • ${socio.telefono || 'Nessun telefono'}</div>
          </td>
          <td class="py-3 px-4">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">
              ${socio.corso_scelto || 'Non indicato'}
            </span>
          </td>
          <td class="py-3 px-4">${certBadge}</td>
          <td class="py-3 px-4">${asiBadge}</td>
          <td class="py-3 px-4 text-center">
            <span class="px-3 py-1 bg-gray-100 rounded-md border border-gray-200 text-xs font-bold text-gray-700">${socio.presenze_totali || 0} lezioni</span>
            ${esameStatusHtml}
          </td>
          <td class="py-3 px-4 text-center">
            <button onclick="registraPresenza('${socio.id}', ${socio.presenze_totali || 0})" class="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-3 py-1.5 rounded-md transition shadow-sm">
              + Registra Presenza
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Filtro per Corso
    function filterSoci() {
      const selected = document.getElementById('filterCorso').value;
      if (selected === 'ALL') {
        renderSoci(allSoci);
      } else {
        const filtered = allSoci.filter(s => s.corso_scelto === selected);
        renderSoci(filtered);
      }
    }

    // Registrazione Presenza
    async function registraPresenza(socioId, presenzeAttuali) {
      const nuovePresenze = presenzeAttuali + 1;
      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ presenze_totali: nuovePresenze })
          .eq('id', socioId);

        if (error) throw error;

        await supabaseClient.from('presenze').insert([
          { socio_id: socioId, data_presenza: new Date().toISOString().split('T')[0] }
        ]);

        await loadSoci();
      } catch (err) {
        alert("Errore durante la registrazione della presenza: " + err.message);
      }
    }

    // Modifica rapida Certificato Medico
    async function modificaCertificato(socioId, dataAttuale) {
      const nuovaData = prompt("Inserisci la nuova data di scadenza del certificato medico (Formato: YYYY-MM-DD):", dataAttuale && dataAttuale !== 'null' ? dataAttuale : "2027-06-30");
      if (nuovaData === null) return;

      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ scadenza_certificato: nuovaData })
          .eq('id', socioId);

        if (error) throw error;
        await loadSoci();
      } catch (err) {
        alert("Errore aggiornamento certificato: " + err.message);
      }
    }

    // Modifica rapida Tessera ASI
    async function modificaAsi(socioId, tesseraAttuale) {
      const nuovaTessera = prompt("Inserisci il numero di tessera ASI:", tesseraAttuale && tesseraAttuale !== 'null' ? tesseraAttuale : "ASI-2026-");
      if (nuovaTessera === null) return;

      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ tessera_asi: nuovaTessera })
          .eq('id', socioId);

        if (error) throw error;
        await loadSoci();
      } catch (err) {
        alert("Errore aggiornamento tessera ASI: " + err.message);
      }
    }

    // Esportazione CSV UTF-8 tramite Blob
    function exportCSV() {
      if (allSoci.length === 0) {
        alert("Nessun dato da esportare.");
        return;
      }

      const headers = ["Nome", "Cognome", "Email", "Telefono", "Corso Scelto", "Certificato Scadenza", "Tessera ASI", "Presenze Totali", "Stato Esame Bambini"];
      const rows = [headers.join(",")];
      const LEZIONI_TOTALI_STIMATE = 60;

      allSoci.forEach(s => {
        let statoEsame = "N/A";
        if (s.corso_scelto && s.corso_scelto.includes('Bambini')) {
          const perc = Math.round(((s.presenze_totali || 0) / LEZIONI_TOTALI_STIMATE) * 100);
          statoEsame = perc >= 70 ? `Idoneo (${perc}%)` : `Valutazione Istruttore (${perc}%)`;
        }

        const row = [
          `"${(s.nome || '').replace(/"/g, '""')}"`,
          `"${(s.cognome || '').replace(/"/g, '""')}"`,
          `"${(s.email || '').replace(/"/g, '""')}"`,
          `"${(s.telefono || '').replace(/"/g, '""')}"`,
          `"${(s.corso_scelto || 'Non indicato').replace(/"/g, '""')}"`,
          `"${(s.scadenza_certificato || '').replace(/"/g, '""')}"`,
          `"${(s.tessera_asi || '').replace(/"/g, '""')}"`,
          `"${s.presenze_totali || 0}"`,
          `"${statoEsame}"`
        ];
        rows.push(row.join(","));
      });

      const csvContent = "\uFEFF" + rows.join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Soci_Fight_Academy_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
