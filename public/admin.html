<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.D. Fight Academy - Dashboard Gestionale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- PWA Manifest e Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#b91c1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3048/3048381.png">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">
    
    <!-- Header Dashboard -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-red-700">A.S.D. FIGHT ACADEMY</h1>
        <p class="text-sm text-slate-500">Pannello Controllo Soci & Registro Presenze</p>
      </div>
      <div class="flex gap-2">
        <select id="filterCorso" onchange="caricaSoci()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
          <option value="tutti">Tutti i Corsi</option>
          <option value="Ninjutsu Adulti/Ragazzi">Ninjutsu Adulti/Ragazzi</option>
          <option value="Ninjutsu Bambini">Ninjutsu Bambini</option>
          <option value="Vietvodao Adulti/Ragazzi">Vietvodao Adulti/Ragazzi</option>
          <option value="Vietvodao Bambini">Vietvodao Bambini</option>
          <option value="Shodo">Shodo (Calligrafia)</option>
        </select>
      </div>
      <!-- Pulsante Esporta CSV Soci -->
            <button onclick="exportSociCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg flex items-center gap-2 shadow-sm transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Esporta CSV Soci
            </button>
    </div>

    <!-- Tabella Elenco Soci -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase text-xs">
            <th class="p-3">Socio</th>
            <th class="p-3">Corso Assegnato</th>
            <th class="p-3">Certificato Medico</th>
            <th class="p-3">Tessera ASI</th>
            <th class="p-3 text-center">Presenze Totali</th>
            <th class="p-3 text-center">Azioni</th>
          </tr>
        </thead>
        <tbody id="listaSoci" class="divide-y divide-slate-100">
          <tr>
            <td colspan="6" class="p-4 text-center text-slate-400">Caricamento in corso...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Configurazione Supabase Client A.S.D. Fight Academy
    const SUPABASE_URL = "https://twiizsottstaacnvrxkg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function caricaSoci() {
      const tbody = document.getElementById('listaSoci');
      const filtro = document.getElementById('filterCorso').value;
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Aggiornamento dati dal database...</td></tr>';

      try {
        // 1. Recupero soci
        let query = _supabase.from('soci').select('*');
        if (filtro !== 'tutti') {
          query = query.eq('corso', filtro);
        }
        
        const { data: soci, error } = await query;
        if (error) throw error;

        if (!soci || soci.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Nessun socio iscritto trovato per questo corso.</td></tr>';
          return;
        }

        // 2. Recupero totale presenze accumulate
        const { data: presenze, error: errPresenze } = await _supabase.from('presenze').select('socio_id');
        if (errPresenze) console.error("Errore recupero presenze:", errPresenze);

        const conteggioPresenze = {};
        if (presenze) {
          presenze.forEach(p => {
            conteggioPresenze[p.socio_id] = (conteggioPresenze[p.socio_id] || 0) + 1;
          });
        }

        tbody.innerHTML = soci.map(socio => {
          const numPresenze = conteggioPresenze[socio.id] || 0;
          return `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-3 font-medium text-slate-900">
                <div>${socio.nome} ${socio.cognome}</div>
                <div class="text-xs text-slate-400">${socio.email || ''} ${socio.telefono ? '• ' + socio.telefono : ''}</div>
              </td>
              <td class="p-3">
                <span class="bg-red-50 text-red-700 text-xs px-2.5 py-1 rounded-md border border-red-100 font-medium">
                  ${socio.corso || 'Non indicato'}
                </span>
              </td>
              <td class="p-3">
                <span class="text-xs px-2 py-1 rounded-md ${socio.scadenza_certificato ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                  ${socio.scadenza_certificato || 'Da verificare'}
                </span>
              </td>
              <td class="p-3">
                <span class="text-xs px-2 py-1 rounded-md ${socio.scadenza_asi ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-600'}">
                  ${socio.scadenza_asi || 'Da registrare'}
                </span>
              </td>
              <td class="p-3 text-center">
                <span class="font-bold text-slate-800 bg-slate-100 px-2.5 py-1 rounded-md text-xs border border-slate-200">
                  ${numPresenze} lezioni
                </span>
              </td>
              <td class="p-3 text-center">
                <button onclick="registraPresenza('${socio.id}', '${socio.corso}')" class="bg-red-700 hover:bg-red-800 text-white text-xs px-3 py-1.5 rounded-lg transition shadow-sm font-medium">
                  + Registra Presenza
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Errore di caricamento: ${err.message}</td></tr>`;
      }
    }

    async function registraPresenza(idSocio, corsoSocio) {
      try {
        const { error } = await _supabase.from('presenze').insert([
          { 
            socio_id: idSocio, 
            corso: corsoSocio,
            data_presenza: new Date().toISOString().split('T')[0]
          }
        ]);

        if (error) throw error;

        alert("Presenza registrata con successo!");
        caricaSoci(); // Ricarica la tabella con il totale aggiornato
      } catch (err) {
        alert("Errore durante la registrazione della presenza: " + err.message);
      }
    }

    // Caricamento automatico all'avvio
    caricaSoci();

    // Funzione per generare e scaricare il file CSV dei soci
    function exportSociCSV() {
    if (!allSoci || allSoci.length === 0) {
        alert("Nessun dato soci disponibile per l'esportazione.");
        return;
    }

    // Intestazioni delle colonne del file Excel/CSV
    const headers = [
        "ID", "Nome", "Cognome", "Codice Fiscale", 
        "Email", "Telefono", "Corso", 
        "Scadenza Certificato", "Stato Tesseramento"
    ];

    // Mappatura delle righe dati dai soci caricati da Supabase
    const rows = allSoci.map(socio => [
        `"${socio.id || ''}"`,
        `"${socio.nome || ''}"`,
        `"${socio.cognome || ''}"`,
        `"${socio.codice_fiscale || ''}"`,
        `"${socio.email || ''}"`,
        `"${socio.telefono || ''}"`,
        `"${socio.corso || ''}"`,
        `"${socio.scadenza_certificato || ''}"`,
        `"${socio.stato || 'Attivo'}"`
    ]);

    // Generazione del contenuto CSV con prefisso BOM UTF-8 (\uFEFF) per corretta apertura accentata su Excel
    const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
    
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    
    const dataOggi = new Date().toISOString().split('T')[0];
    link.setAttribute("href", url);
    link.setAttribute("download", `Soci_Fight_Academy_${dataOggi}.csv`);
    document.body.appendChild(link);
    
    link.click();
    document.body.removeChild(link);
    }   
  </script>
</body>
</html>
