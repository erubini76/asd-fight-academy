<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.D. Fight Academy - Pannello Controllo e Approvazioni</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto">
    <!-- HEADER PANNELLO -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 mb-6 border-b border-gray-200 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-red-700 tracking-tight">A.S.D. FIGHT ACADEMY</h1>
        <p class="text-sm text-gray-500 font-medium">Pannello Presidente: Verifica Certificati e Approvazione Pagamenti</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- FILTRO CORSI -->
        <select id="filterCorso" onchange="filterSoci()" class="bg-white border border-gray-300 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-red-600">
          <option value="ALL">Tutti i Corsi</option>
          <option value="Ninjutsu Adulti/Ragazzi">Ninjutsu Adulti/Ragazzi</option>
          <option value="Ninjutsu Bambini">Ninjutsu Bambini</option>
          <option value="Vietvodao Adulti/Ragazzi">Vietvodao Adulti/Ragazzi</option>
          <option value="Vietvodao Bambini">Vietvodao Bambini</option>
          <option value="Shodo (Calligrafia Giapponese)">Shodo (Calligrafia Giapponese)</option>
        </select>

        <!-- PULSANTE ESPORTA CSV -->
        <button onclick="exportCSV()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2 rounded-lg shadow transition duration-150">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Esporta CSV Soci
        </button>
      </div>
    </header>

    <!-- TABELLA SOCI -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-xs font-bold text-gray-500 uppercase tracking-wider border-b border-gray-200">
              <th class="py-3 px-4">SOCIO / CORSO</th>
              <th class="py-3 px-4">CERTIFICATO MEDICO (VERIFICA)</th>
              <th class="py-3 px-4">PAGAMENTO & RICEVUTA (VERIFICA)</th>
              <th class="py-3 px-4 text-center">PRESENZE / ESAMI</th>
              <th class="py-3 px-4 text-center">AZIONI RAPIDE</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="5" class="py-8 text-center text-gray-400 font-medium">Caricamento dati soci in corso...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Inizializzazione Supabase Client
    const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allSoci = [];

    document.addEventListener('DOMContentLoaded', loadSoci);

    async function loadSoci() {
      try {
        const { data, error } = await supabaseClient
          .from('soci')
          .select('*')
          .order('cognome', { ascending: true });

        if (error) throw error;

        allSoci = data || [];
        renderSoci(allSoci);
      } catch (err) {
        console.error('Errore nel caricamento:', err);
        document.getElementById('tableBody').innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-red-500 font-semibold">
              Errore di connessione al database. Riprova più tardi.
            </td>
          </tr>`;
      }
    }

    function renderSoci(soci) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (soci.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-gray-400 font-medium">Nessun socio trovato.</td>
          </tr>`;
        return;
      }

      const LEZIONI_TOTALI_STIMATE = 60;

      soci.forEach(socio => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 transition duration-100 align-top";

        // Sezione Certificato Medico e Approvazione Presidente
        let certHtml = `<div class="flex flex-col gap-1">`;
        if (socio.certificato_url) {
          certHtml += `<a href="${socio.certificato_url}" target="_blank" class="text-xs text-blue-600 underline font-medium">📄 Vedi Certificato Caricato</a>`;
        } else {
          certHtml += `<span class="text-xs text-gray-400">Nessun file caricato dal socio</span>`;
        }
        
        certHtml += `<span class="text-xs font-semibold text-gray-700 mt-1">Scadenza: ${socio.scadenza_certificato || 'Non indicata'}</span>`;
        
        let statoCert = socio.certificato_stato || 'Da inserire';
        let bgCert = statoCert === 'Approvato' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800';
        certHtml += `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full w-fit ${bgCert}">Stato: ${statoCert}</span>`;
        
        certHtml += `<div class="flex gap-1 mt-1">
          <button onclick="approvaCertificato('${socio.id}')" class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded font-medium hover:bg-emerald-700">Approva</button>
          <button onclick="modificaCertificato('${socio.id}', '${socio.scadenza_certificato || ''}')" class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-medium hover:bg-gray-300">Modifica Scadenza</button>
        </div></div>`;

        // Sezione Pagamento, Ricevuta e Correzione Importo €
        let pagHtml = `<div class="flex flex-col gap-1">`;
        if (socio.ricevuta_url) {
          pagHtml += `<a href="${socio.ricevuta_url}" target="_blank" class="text-xs text-blue-600 underline font-medium">💶 Vedi Ricevuta/Bonifico</a>`;
        } else {
          pagHtml += `<span class="text-xs text-gray-400">Nessuna ricevuta caricata</span>`;
        }

        pagHtml += `<div class="flex items-center gap-1 mt-1">
          <span class="text-xs font-bold text-gray-700">Importo: € ${Number(socio.importo_pagamento || 0).toFixed(2)}</span>
          <button onclick="correggiImporto('${socio.id}', ${socio.importo_pagamento || 0})" class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold hover:bg-amber-200" title="Correggi importo in Euro">✏️ Correggi</button>
        </div>`;

        let statoPag = socio.pagamento_stato || 'Da verificare';
        let bgPag = statoPag === 'Confermato' ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800';
        pagHtml += `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full w-fit ${bgPag}">Stato: ${statoPag}</span>`;

        pagHtml += `<button onclick="confermaPagamento('${socio.id}')" class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded font-medium hover:bg-emerald-700 mt-1 w-fit">Conferma Pagamento</button>
        </div>`;

        // Calcolo esame bambini
        let esameStatusHtml = '';
        if (socio.corso_scelto && socio.corso_scelto.includes('Bambini')) {
          const presenze = socio.presenze_totali || 0;
          const percentuale = Math.round((presenze / LEZIONI_TOTALI_STIMATE) * 100);
          if (percentuale >= 70) {
            esameStatusHtml = `<div class="mt-1 text-[10px] font-bold text-green-700 bg-green-50 px-2 py-0.5 rounded border border-green-200">🟢 Idoneo Esame (${percentuale}%)[cite: 2]</div>`;
          } else {
            esameStatusHtml = `<div class="mt-1 text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">⚠️ Valutazione Istruttore (${percentuale}%)[cite: 2]</div>`;
          }
        }

        tr.innerHTML = `
          <td class="py-3 px-4 font-semibold text-gray-900">
            <div>${socio.nome || ''} ${socio.cognome || ''}</div>
            <div class="text-xs text-gray-500 font-normal">${socio.email || 'Nessuna email'} • ${socio.telefono || 'Nessun telefono'}</div>
            <div class="mt-1"><span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-blue-100 text-blue-800">${socio.corso_scelto || 'Non indicato'}</span></div>
          </td>
          <td class="py-3 px-4">${certHtml}</td>
          <td class="py-3 px-4">${pagHtml}</td>
          <td class="py-3 px-4 text-center">
            <span class="px-2 py-1 bg-gray-100 rounded border border-gray-200 text-xs font-bold text-gray-700">${socio.presenze_totali || 0} lez.</span>
            ${esameStatusHtml}
          </td>
          <td class="py-3 px-4 text-center">
            <button onclick="registraPresenza('${socio.id}', ${socio.presenze_totali || 0})" class="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-3 py-1.5 rounded transition shadow-sm w-full mb-1">
              + Presenza
            </button>
            <span class="text-[10px] text-gray-400 block">Tessera ASI: ${socio.tessera_asi || 'Da emettere'}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterSoci() {
      const selected = document.getElementById('filterCorso').value;
      if (selected === 'ALL') {
        renderSoci(allSoci);
      } else {
        const filtered = allSoci.filter(s => s.corso_scelto === selected);
        renderSoci(filtered);
      }
    }

    // Funzioni di Approvazione e Correzione Presidente
    async function approvaCertificato(socioId) {
      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ certificato_stato: 'Approvato' })
          .eq('id', socioId);
        if (error) throw error;
        await loadSoci();
      } catch (err) {
        alert("Errore approvazione certificato: " + err.message);
      }
    }

    async function modificaCertificato(socioId, dataAttuale) {
      const nuovaData = prompt("Inserisci la data di scadenza corretta (YYYY-MM-DD):", dataAttuale || "2027-06-30");
      if (!nuovaData) return;
      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ scadenza_certificato: nuovaData, certificato_stato: 'Approvato' })
          .eq('id', socioId);
        if (error) throw error;
        await loadSoci();
      } catch (err) {
        alert("Errore aggiornamento scadenza: " + err.message);
      }
    }

    async function correggiImporto(socioId, importoAttuale) {
      const nuovoImporto = prompt("Correggi l'importo in Euro inserito dal socio (es. 50.00):", importoAttuale);
      if (nuovoImporto === null) return;
      const parsed = parseFloat(nuovoImporto.replace(',', '.'));
      if (isNaN(parsed)) {
        alert("Importo non valido.");
        return;
      }
      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ importo_pagamento: parsed, pagamento_stato: 'Confermato' })
          .eq('id', socioId);
        if (error) throw error;
        await loadSoci();
      } catch (err) {
        alert("Errore correzione importo: " + err.message);
      }
    }

    async function confermaPagamento(socioId) {
      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ pagamento_stato: 'Confermato' })
          .eq('id', socioId);
        if (error) throw error;
        await loadSoci();
      } catch (err) {
        alert("Errore conferma pagamento: " + err.message);
      }
    }

    async function registraPresenza(socioId, presenzeAttuali) {
      const nuovePresenze = presenzeAttuali + 1;
      try {
        const { error } = await supabaseClient
          .from('soci')
          .update({ presenze_totali: nuovePresenze })
          .eq('id', socioId);
        if (error) throw error;

        await supabaseClient.from('presenze').insert([
          { socio_id: socioId, data_presenza: new Date().toISOString().split('T')[0] }
        ]);

        await loadSoci();
      } catch (err) {
        alert("Errore registrazione presenza: " + err.message);
      }
    }

    function exportCSV() {
      if (allSoci.length === 0) {
        alert("Nessun dato da esportare.");
        return;
      }
      const headers = ["Nome", "Cognome", "Email", "Telefono", "Corso", "Scadenza Certificato", "Stato Certificato", "Importo Pagato (€)", "Stato Pagamento", "Presenze"];
      const rows = [headers.join(",")];
      allSoci.forEach(s => {
        const row = [
          `"${(s.nome || '').replace(/"/g, '""')}"`,
          `"${(s.cognome || '').replace(/"/g, '""')}"`,
          `"${(s.email || '').replace(/"/g, '""')}"`,
          `"${(s.telefono || '').replace(/"/g, '""')}"`,
          `"${(s.corso_scelto || '').replace(/"/g, '""')}"`,
          `"${(s.scadenza_certificato || '')}"`,
          `"${(s.certificato_stato || '')}"`,
          `"${s.importo_pagamento || 0}"`,
          `"${(s.pagamento_stato || '')}"`,
          `"${s.presenze_totali || 0}"`
        ];
        rows.push(row.join(","));
      });
      const csvContent = "\uFEFF" + rows.join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Verifiche_Presidenziali_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
