<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Fight Academy - Gestione Contabilità</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contab-table td:first-child p {
            font-size: 12px !important;
        }
        @media (max-width: 640px) {
            .contab-table th:first-child,
            .contab-table td:first-child {
                min-width: 220px !important;
            }
            .contab-table td:first-child p {
                font-size: 12px !important;
            }
            .contab-table td:first-child span {
                max-width: 140px !important;
                white-space: normal;
            }
            .contab-table th,
            .contab-table td {
                padding: 0.65rem !important;
            }
            .contab-table {
                min-width: 900px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans text-center">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- HEADER -->
        <header class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-emerald-600 p-3 rounded-2xl text-white shadow-lg">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight uppercase">Gestione Contabilità</h1>
                    <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest leading-none mt-1">Metriche, Pagamenti e Morosità</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </header>

        <!-- KPI SUMMARY -->
        <div id="kpi-section" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>

        <!-- FILTRI AVANZATI -->
        <section id="filters-section" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg flex flex-wrap gap-4 items-end text-[10px] justify-center text-left">
            <div class="min-w-[150px]">
                <label class="block font-bold text-slate-500 uppercase mb-1">Visualizzazione</label>
                <select id="filter-year-type" onchange="caricaDatiContabili()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                    <option value="accademico">Anno Accademico (Set-Ago)</option>
                    <option value="solare">Anno Solare (Gen-Dic)</option>
                </select>
            </div>
            <div class="min-w-[120px]">
                <label class="block font-bold text-slate-500 uppercase mb-1">Anno</label>
                <select id="filter-year-val" onchange="caricaDatiContabili()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <div class="min-w-[180px]">
                <label class="block font-bold text-slate-500 uppercase mb-1">Corso</label>
                <select id="filter-corso" onchange="caricaDatiContabili()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                    <option value="tutti">Tutti i Corsi</option>
                </select>
            </div>
        </section>

        <!-- GRIGLIA PAGAMENTI MENSILI -->
        <main class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-700 bg-slate-700/30 flex flex-col md:flex-row justify-between items-center gap-4 text-[9px]">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-emerald-400"></i> Registro Analitico Pagamenti
                </h2>
                <div class="flex gap-4 font-bold uppercase tracking-tighter">
                    <span class="flex items-center gap-1.5 text-green-400 bg-green-400/10 px-2 py-1 rounded-lg border border-green-400/20"><i class="fa-solid fa-square text-[7px]"></i> Pagato</span>
                    <span class="flex items-center gap-1.5 text-red-500 bg-red-500/10 px-2 py-1 rounded-lg border border-red-500/20"><i class="fa-solid fa-triangle-exclamation text-[7px]"></i> Moroso</span>
                    <span class="flex items-center gap-1.5 text-amber-400 bg-amber-400/10 px-2 py-1 rounded-lg border border-amber-400/20 animate-pulse"><i class="fa-solid fa-clock text-[7px]"></i> In Verifica</span>
                    <span class="flex items-center gap-1.5 text-slate-500 bg-slate-500/10 px-2 py-1 rounded-lg border border-slate-500/20"><i class="fa-solid fa-user-slash text-[7px]"></i> Non Prat.</span>
                </div>
            </div>
            
            <div class="overflow-x-auto relative">
                <div class="absolute right-4 top-4 hidden sm:block rounded-full bg-slate-900/90 border border-slate-700 px-3 py-1 text-[10px] text-slate-300 shadow-lg">
                    Scorri orizzontalmente ↔
                </div>
                <div class="mb-3 block sm:hidden text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">
                    Scorri la tabella a sinistra/destra
                </div>
                <table class="contab-table w-full text-left text-[10px] border-collapse min-w-[1000px] table-fixed">
                    <thead class="bg-slate-900/50 text-slate-400 uppercase font-bold border-b border-slate-700">
                        <tr id="table-header-row"></tr>
                    </thead>
                    <tbody id="contabilita-tbody" class="divide-y divide-slate-700/50 text-slate-300">
                        <tr><td colspan="15" class="p-12 text-center text-slate-500 italic">Caricamento flussi in corso...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODALE PAGAMENTO -->
    <div id="modal-pagamento" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 text-left">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white text-center" id="modal-title">Gestisci</h3>
            <div id="container-ricevuta" class="hidden bg-slate-900/80 p-3 rounded-xl border border-amber-500/30 text-center space-y-2">
                <p class="text-[9px] font-bold text-amber-400 uppercase tracking-widest">Allegato Ricevuto</p>
                <a id="btn-view-ricevuta" href="#" target="_blank" class="block bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-[10px] uppercase shadow-lg">Apri Ricevuta</a>
            </div>
            <div class="space-y-3">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Importo (€)</label>
                <input type="number" id="pay-amount" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Metodo</label>
                <select id="pay-method" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                    <option value="contanti">Contanti</option>
                    <option value="bonifico">Bonifico</option>
                </select>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="salvaPagamentoRapido()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs uppercase shadow-lg">Salva / Approva</button>
                <button id="btn-delete-paga" onclick="eliminaPagamento()" class="hidden flex-1 bg-red-900 hover:bg-red-800 text-white font-bold py-3 rounded-xl text-xs uppercase">Elimina</button>
                <button id="btn-non-prat" onclick="toggleMorositaConvalidata()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl text-xs uppercase">Non Prat.</button>
            </div>
            <button onclick="closeModal()" class="w-full text-slate-500 text-[10px] font-bold uppercase hover:text-white transition">Chiudi</button>
        </div>
    </div>

    <script>
        const sessionUser = JSON.parse(localStorage.getItem('asd_admin_user'));
        if (!sessionUser) location.href = 'admin.html';

        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const mesiAccademici = [
            { id: 9, nome: 'Set' }, { id: 10, nome: 'Ott' }, { id: 11, nome: 'Nov' }, { id: 12, nome: 'Dic' },
            { id: 1, nome: 'Gen' }, { id: 2, nome: 'Feb' }, { id: 3, nome: 'Mar' }, { id: 4, nome: 'Apr' },
            { id: 5, nome: 'Mag' }, { id: 6, nome: 'Giu' }, { id: 7, nome: 'Lug' }, { id: 8, nome: 'Ago' }
        ];
        const mesiSolari = [
            { id: 1, nome: 'Gen' }, { id: 2, nome: 'Feb' }, { id: 3, nome: 'Mar' }, { id: 4, nome: 'Apr' },
            { id: 5, nome: 'Mag' }, { id: 6, nome: 'Giu' }, { id: 7, nome: 'Lug' }, { id: 8, nome: 'Ago' },
            { id: 9, nome: 'Set' }, { id: 10, nome: 'Ott' }, { id: 11, nome: 'Nov' }, { id: 12, nome: 'Dic' }
        ];

        let currentSelection = { socioId: null, mese: null, anno: null, tipo: '', existingPagId: null };

        function renderHeader() {
            const row = document.getElementById('table-header-row');
            row.innerHTML = '<th class="p-4 sticky left-0 bg-slate-900 z-10 min-w-[180px] sm:min-w-[220px] text-left">Tesserato / Corso</th><th class="p-4 text-center border-l border-slate-800 bg-slate-900/80">Tesseramento</th>';
            const mesi = document.getElementById('filter-year-type').value === 'accademico' ? mesiAccademici : mesiSolari;
            mesi.forEach(m => row.innerHTML += `<th class="p-4 text-center border-l border-slate-800">${m.nome}</th>`);
        }

        function getCorsoDisplayFromSocio(socio) {
            const iscrizioni = Array.isArray(socio?.iscrizioni_corsi) ? socio.iscrizioni_corsi : [];
            const latest = iscrizioni.slice().sort((a, b) => new Date(b.data_iscrizione || 0) - new Date(a.data_iscrizione || 0))[0];
            return latest?.nome_corso || 'N/D';
        }

        function getCorsiNomiSocio(socio) {
            const iscrizioni = Array.isArray(socio?.iscrizioni_corsi) ? socio.iscrizioni_corsi : [];
            const nomi = iscrizioni.map(i => i.nome_corso).filter(Boolean);
            return nomi.length > 0 ? [...new Set(nomi)] : ['N/D'];
        }

        async function caricaDatiContabili() {
            const tbody = document.getElementById('contabilita-tbody');
            const typeYear = document.getElementById('filter-year-type').value;
            const yearVal = parseInt(document.getElementById('filter-year-val').value);
            const selectCorso = document.getElementById('filter-corso');
            const mesiCur = typeYear === 'accademico' ? mesiAccademici : mesiSolari;

            if (selectCorso.options.length <= 1) {
                const corsi = sessionUser.ruolo === 'presidente' ? 
                    ["Ninjutsu Adulti/Ragazzi", "Ninjutsu Bambini", "Vietvodao Adulti/Ragazzi", "Vietvodao Bambini", "Shodo (Calligrafia)"] : 
                    sessionUser.corsi_competenze;
                corsi.forEach(c => selectCorso.add(new Option(c, c)));
            }

            try {
                const { data: allSoci } = await supabaseClient
                    .from('soci')
                    .select('*')
                    .order('cognome');
                const { data: allIscrizioni } = await supabaseClient
                    .from('iscrizioni_corsi')
                    .select('socio_id, nome_corso, stato, data_iscrizione');
                (allSoci || []).forEach(s => {
                    s.iscrizioni_corsi = (allIscrizioni || []).filter(i => i.socio_id === s.id);
                });
                const { data: allPags } = await supabaseClient.from('pagamenti').select('*');
                const { data: allPres } = await supabaseClient.from('presenze').select('*');

                const corsoFiltro = selectCorso.value;
                let sociFiltrati = allSoci;
                if (sessionUser.ruolo !== 'presidente') {
                    const comp = sessionUser.corsi_competenze.map(c => c.toLowerCase().trim());
                    sociFiltrati = allSoci.filter(s => {
                        const corsiSocio = getCorsiNomiSocio(s).map(n => n.toLowerCase());
                        return comp.some(c => corsiSocio.some(nome => nome.includes(c)));
                    });
                }
                if (corsoFiltro !== 'tutti') {
                    const filtroLower = corsoFiltro.toLowerCase().trim();
                    sociFiltrati = sociFiltrati.filter(s => getCorsiNomiSocio(s).some(nome => nome.toLowerCase().includes(filtroLower)));
                }

                renderHeader();
                tbody.innerHTML = '';
                const totaliMese = { iscrizione: 0 };
                mesiCur.forEach(m => totaliMese[m.id] = 0);

                sociFiltrati.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-700/20 transition";
                    const corsoDisplay = getCorsoDisplayFromSocio(s);
                    let html = `<td class="p-3 sticky left-0 bg-slate-800 z-10 border-r border-slate-700 text-left leading-tight min-w-[180px] sm:min-w-[220px] break-words"><p class="font-bold text-white text-[12px]">${s.cognome} ${s.nome}</p><span class="text-[7px] inline-block px-1 bg-slate-900 border border-slate-700 rounded text-slate-400 font-bold uppercase max-w-[140px] sm:max-w-[200px] truncate">${corsoDisplay}</span></td>`;

                    const pIsc = allPags.find(p => p.socio_id === s.id && p.corso === 'Iscrizione Annuale' && p.stato === 'Approvato');
                    const pIscPending = allPags.find(p => p.socio_id === s.id && p.corso === 'Iscrizione Annuale' && p.stato === 'In attesa di verifica');
                    if (pIsc) totaliMese.iscrizione += (parseFloat(pIsc.importo) || 0);

                    html += `<td class="p-2 text-center border-l border-slate-800 cursor-pointer ${pIsc ? 'bg-cyan-600/20 text-cyan-400 font-bold' : (pIscPending ? 'bg-amber-400/20 text-amber-400 animate-pulse' : 'bg-slate-900/30')}" onclick="openPayModal('${s.id}', '${s.nome} ${s.cognome}', 0, ${yearVal}, 'Iscrizione Annuale', ${pIsc ? pIsc.id : (pIscPending ? pIscPending.id : null)}, '${pIsc ? pIsc.ricevuta_url : (pIscPending ? pIscPending.ricevuta_url : '')}', ${pIsc ? pIsc.importo : 0})">${pIsc ? '€'+parseFloat(pIsc.importo).toFixed(0) : (pIscPending ? '<i class="fa-solid fa-clock text-[8px]"></i>' : '<i class="fa-solid fa-plus opacity-5"></i>')}</td>`;

                    mesiCur.forEach(m => {
                        const anno = typeYear === 'solare' ? yearVal : (m.id >= 9 ? yearVal : yearVal + 1);
                        const p = allPags.find(pag => pag.socio_id === s.id && pag.mese_riferimento === m.id && pag.anno_riferimento === anno && pag.stato === 'Approvato');
                        const pPend = allPags.find(pag => pag.socio_id === s.id && pag.mese_riferimento === m.id && pag.anno_riferimento === anno && pag.stato === 'In attesa di verifica');
                        if (p) totaliMese[m.id] += (parseFloat(p.importo) || 0);

                        const anniPresenza = [anno];
                        const annoCorrente = new Date().getFullYear();
                        if (typeYear === 'accademico' && m.id === 8 && anno === annoCorrente + 1) {
                            anniPresenza.push(annoCorrente);
                        }
                        const corsiPresenza = corsoFiltro === 'tutti'
                            ? getCorsiNomiSocio(s)
                            : [corsoFiltro];
                        const eraPres = allPres.some(pr => {
                            const d = new Date(pr.data_presenza);
                            const corsoPresenza = String(pr.corso || '').trim().toLowerCase();
                            return pr.socio_id === s.id
                                && corsiPresenza.some(c => corsoPresenza === String(c).trim().toLowerCase())
                                && (d.getMonth() + 1) === m.id
                                && anniPresenza.includes(d.getFullYear());
                        });
                        const nonPrat = s.mesi_non_praticante && s.mesi_non_praticante.includes(`${m.id}-${anno}`);

                        let style = 'bg-slate-900/30', content = '<i class="fa-solid fa-plus opacity-5"></i>';
                        if (p) { style = 'bg-green-600/20 text-green-400 font-bold'; content = '€' + parseFloat(p.importo).toFixed(0); }
                        else if (pPend) { style = 'bg-amber-400/20 text-amber-400 animate-pulse'; content = '<i class="fa-solid fa-clock text-[8px]"></i>'; }
                        else if (eraPres) { style = 'bg-red-600/20 text-red-500 animate-pulse'; content = '<i class="fa-solid fa-triangle-exclamation text-[8px]"></i>'; }
                        else if (nonPrat) { style = 'bg-slate-700/50 text-slate-500'; content = '<i class="fa-solid fa-user-slash text-[8px]"></i>'; }

                        html += `<td class="p-2 text-center border-l border-slate-800 cursor-pointer hover:bg-slate-700/50 transition-all ${style}" onclick="openPayModal('${s.id}', '${s.nome} ${s.cognome}', ${m.id}, ${anno}, 'Mensilità', ${p ? p.id : (pPend ? pPend.id : null)}, '${p ? p.ricevuta_url : (pPend ? pPend.ricevuta_url : '')}', ${p ? p.importo : 0})">${content}</td>`;
                    });
                    tr.innerHTML = html; tbody.appendChild(tr);
                });

                const trTot = document.createElement('tr');
                trTot.className = "bg-slate-950 font-black text-white border-t-2 border-slate-600";
                let tHtml = `<td class="p-4 sticky left-0 bg-slate-950 z-10 uppercase tracking-widest text-[9px] text-left">Totali Mensili</td><td class="p-2 text-center border-l border-slate-700 text-cyan-400 font-extrabold">€${totaliMese.iscrizione.toFixed(0)}</td>`;
                mesiCur.forEach(m => tHtml += `<td class="p-2 text-center border-l border-slate-800">€${totaliMese[m.id].toFixed(0)}</td>`);
                trTot.innerHTML = tHtml; tbody.appendChild(trTot);

                renderKPI(allPags, sociFiltrati);
            } catch (err) { console.error(err); }
        }

        function renderKPI(pags, sociVis) {
            const sIds = sociVis.map(s => s.id);
            const pFilt = pags.filter(p => p.stato === 'Approvato' && sIds.includes(p.socio_id));
            const totVis = pFilt.reduce((sum, p) => sum + (parseFloat(p.importo) || 0), 0);
            const totMese = pFilt.filter(p => (new Date(p.data_pagamento).getMonth()+1) === (new Date().getMonth()+1)).reduce((sum, p) => sum + (parseFloat(p.importo) || 0), 0);
            document.getElementById('kpi-section').innerHTML = `<div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center"><p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest leading-none">Entrate Mese</p><p class="text-2xl font-black text-emerald-400 leading-none">€${totMese.toFixed(0)}</p></div><div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center"><p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest leading-none">Totale Visibile</p><p class="text-2xl font-black text-white leading-none">€${totVis.toFixed(0)}</p></div><div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg col-span-2 flex flex-col justify-center text-center"><p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest leading-none">Istruttore Attivo</p><p class="text-xs font-black text-cyan-400 uppercase tracking-widest leading-none truncate">${sessionUser.nome}</p></div>`;
        }

        function openPayModal(socId, nome, mese, anno, tipo, pagId, url, imp) {
            currentSelection = { socioId: socId, mese, anno, tipo, existingPagId: pagId };
            const label = (mese === 0) ? 'Iscrizione' : (mesiAccademici.find(m => m.id === mese) || mesiSolari.find(m => m.id === mese)).nome;
            document.getElementById('modal-title').textContent = `${label} ${anno} - ${nome}`;
            const contRic = document.getElementById('container-ricevuta');
            if (url) { contRic.classList.remove('hidden'); document.getElementById('btn-view-ricevuta').href = url; } else contRic.classList.add('hidden');
            document.getElementById('pay-amount').value = imp || '';
            document.getElementById('btn-delete-paga').classList.toggle('hidden', !pagId);
            document.getElementById('modal-pagamento').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal-pagamento').classList.add('hidden'); }

        async function salvaPagamentoRapido() {
            const imp = document.getElementById('pay-amount').value;
            const met = document.getElementById('pay-method').value;
            if (!imp && !currentSelection.existingPagId) return;
            try {
                const paymentRecord = { socio_id: currentSelection.socioId, importo: parseFloat(imp) || 0, importo_totale: parseFloat(imp) || 0, mese_riferimento: currentSelection.mese, anno_riferimento: currentSelection.anno, data_pagamento: new Date().toISOString().split('T')[0], metodo: met, stato: 'Approvato', corso: currentSelection.tipo, tipo_pagamento: currentSelection.tipo, periodo_riferimento: currentSelection.mese === 0 ? 'Annuale' : `${currentSelection.mese}/${currentSelection.anno}` };
                
                // ✅ UPSERT: Se esiste, aggiorna; se no, crea
                const { error } = await supabaseClient.from('pagamenti').upsert([paymentRecord], { onConflict: 'socio_id,mese_riferimento,anno_riferimento,corso' });
                if (error) throw error;
                closeModal(); caricaDatiContabili();
            } catch (err) { alert(err.message); }
        }

        async function eliminaPagamento() {
            if (!confirm("Sei sicuro di voler eliminare questo pagamento?")) return;
            try {
                await supabaseClient.from('pagamenti').delete().eq('id', currentSelection.existingPagId);
                closeModal(); caricaDatiContabili();
            } catch (err) { alert(err.message); }
        }

        async function toggleMorositaConvalidata() {
            const key = `${currentSelection.mese}-${currentSelection.anno}`;
            try {
                const { data: s } = await supabaseClient.from('soci').select('mesi_non_praticante').eq('id', currentSelection.socioId).single();
                let m = s.mesi_non_praticante || [];
                m = m.includes(key) ? m.filter(x => x !== key) : [...m, key];
                await supabaseClient.from('soci').update({ mesi_non_praticante: m }).eq('id', currentSelection.socioId);
                closeModal(); caricaDatiContabili();
            } catch (err) { alert(err.message); }
        }

        document.getElementById('filters-section').classList.remove('hidden');
        caricaDatiContabili();
    </script>
</body>
</html>
