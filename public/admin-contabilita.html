<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.D. Fight Academy - Gestione Contabilità</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- HEADER -->
        <header class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-emerald-600 p-3 rounded-2xl text-white shadow-lg">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight uppercase">Gestione Contabilità</h1>
                    <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Metriche, Pagamenti e Morosità</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold transition shadow-sm border border-slate-600 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </header>

        <!-- KPI SUMMARY -->
        <div id="kpi-section" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- Dinamico -->
        </div>

        <!-- FILTRI AVANZATI -->
        <section id="filters-section" class="hidden bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg flex flex-wrap gap-4 items-end text-[10px]">
            <div class="flex-1 min-w-[150px]">
                <label class="block font-bold text-slate-500 uppercase mb-1">Visualizza Per</label>
                <select id="filter-year-type" onchange="caricaDatiContabili()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                    <option value="accademico">Anno Accademico (Sett-Ago)</option>
                    <option value="solare">Anno Solare (Gen-Dic)</option>
                </select>
            </div>
            <div class="flex-1 min-w-[120px]">
                <label class="block font-bold text-slate-500 uppercase mb-1">Seleziona Anno</label>
                <select id="filter-year-val" onchange="caricaDatiContabili()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </div>
            <div class="flex-1 min-w-[150px]">
                <label class="block font-bold text-slate-500 uppercase mb-1">Filtra Corso</label>
                <select id="filter-corso" onchange="caricaDatiContabili()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                    <option value="tutti">Tutti i Corsi</option>
                    <option value="Ninjutsu Adulti/Ragazzi">Ninjutsu Adulti / Ragazzi</option>
                    <option value="Ninjutsu Bambini">Ninjutsu Bambini</option>
                    <option value="Vietvodao Adulti/Ragazzi">Vietvodao Adulti / Ragazzi</option>
                    <option value="Vietvodao Bambini">Vietvodao Bambini</option>
                    <option value="Shodo (Calligrafia)">Shodo</option>
                </select>
            </div>
        </section>

        <!-- GRIGLIA PAGAMENTI MENSILI -->
        <main class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-700 bg-slate-700/30 flex justify-between items-center text-[10px]">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-emerald-400"></i> Registro Pagamenti A.A. 2026/2027
                </h2>
                <div class="flex gap-4 font-bold uppercase">
                    <span class="flex items-center gap-1.5 text-green-400"><i class="fa-solid fa-square"></i> Pagato</span>
                    <span class="flex items-center gap-1.5 text-red-500"><i class="fa-solid fa-square"></i> Moroso</span>
                    <span class="flex items-center gap-1.5 text-slate-500"><i class="fa-solid fa-square"></i> Non Praticante</span>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-[10px] border-collapse min-w-[1200px]">
                    <thead class="bg-slate-900/50 text-slate-400 uppercase font-bold border-b border-slate-700">
                        <tr id="table-header-row">
                            <!-- Dinamico -->
                        </tr>
                    </thead>
                    <tbody id="contabilita-tbody" class="divide-y divide-slate-700/50 text-slate-300 text-center">
                        <tr>
                            <td colspan="14" class="p-12 text-center text-slate-500 italic">Analisi contabile e incrocio presenze...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODALE REGISTRAZIONE PAGAMENTO -->
    <div id="modal-pagamento" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white" id="modal-title">Registra Pagamento</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Importo (€)</label>
                    <input type="number" id="pay-amount" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Metodo</label>
                    <select id="pay-method" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                        <option value="contanti">Contanti</option>
                        <option value="bonifico">Bonifico</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="salvaPagamentoRapido()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition uppercase">Salva</button>
                <button onclick="toggleMorositaConvalidata()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl text-xs transition uppercase">Non Praticante</button>
            </div>
            <button onclick="closeModal()" class="w-full text-slate-500 text-[10px] font-bold uppercase hover:text-white transition">Annulla</button>
        </div>
    </div>

    <script>
        const sessionUser = JSON.parse(localStorage.getItem('asd_admin_user'));
        if (!sessionUser) location.href = 'admin.html';

        const SUPABASE_URL = 'https://twiizsottstaacnvrxkg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aWl6c290dHN0YWFjbnZyeGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDk3ODAsImV4cCI6MjEwMTQyNTc4MH0.ksm6L4sWhCQ-zWY2SsYbZPuhdXhvevprrd2aIsMXfFI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const mesiAccademici = [
            { id: 9, nome: 'Set' }, { id: 10, nome: 'Ott' }, { id: 11, nome: 'Nov' }, { id: 12, nome: 'Dic' },
            { id: 1, nome: 'Gen' }, { id: 2, nome: 'Feb' }, { id: 3, nome: 'Mar' }, { id: 4, nome: 'Apr' },
            { id: 5, nome: 'Mag' }, { id: 6, nome: 'Giu' }, { id: 7, nome: 'Lug' }, { id: 8, nome: 'Ago' }
        ];
        const mesiSolari = [
            { id: 1, nome: 'Gen' }, { id: 2, nome: 'Feb' }, { id: 3, nome: 'Mar' }, { id: 4, nome: 'Apr' },
            { id: 5, nome: 'Mag' }, { id: 6, nome: 'Giu' }, { id: 7, nome: 'Lug' }, { id: 8, nome: 'Ago' },
            { id: 9, nome: 'Set' }, { id: 10, nome: 'Ott' }, { id: 11, nome: 'Nov' }, { id: 12, nome: 'Dic' }
        ];

        let currentSelection = { socioId: null, mese: null, anno: null, tipo: '' };

        function renderHeader() {
            const row = document.getElementById('table-header-row');
            row.innerHTML = '<th class="p-4 sticky left-0 bg-slate-900 z-10 min-w-[200px] text-left">Socio / Corso</th><th class="p-4 text-center border-l border-slate-800 bg-slate-900/80">Iscrizione</th>';
            const tipoAnno = document.getElementById('filter-year-type').value;
            const mesi = (tipoAnno === 'accademico') ? mesiAccademici : mesiSolari;
            mesi.forEach(m => {
                const th = document.createElement('th');
                th.className = "p-4 text-center border-l border-slate-800";
                th.textContent = m.nome;
                row.appendChild(th);
            });
        }

        async function caricaDatiContabili() {
            const tbody = document.getElementById('contabilita-tbody');
            document.getElementById('filters-section').classList.remove('hidden');

            try {
                const tipoAnno = document.getElementById('filter-year-type').value;
                const annoSelezionato = parseInt(document.getElementById('filter-year-val').value);
                const corsoFiltro = document.getElementById('filter-corso').value;
                const mesiCorrenti = (tipoAnno === 'accademico') ? mesiAccademici : mesiSolari;

                renderHeader();

                const { data: allSoci } = await supabaseClient.from('soci').select('*').order('cognome');
                let soci = allSoci;
                if (sessionUser.ruolo !== 'presidente') {
                    const comp = (sessionUser.corsi_competenze || []).map(c => c.toLowerCase().trim());
                    soci = allSoci.filter(s => {
                        const cs = (s.corso_scelto || '').toLowerCase().trim();
                        return comp.some(c => cs.includes(c) || c.includes(cs));
                    });
                } else if (corsoFiltro !== 'tutti') {
                    soci = allSoci.filter(s => (s.corso_scelto || '').includes(corsoFiltro));
                }

                const { data: pagamenti } = await supabaseClient.from('pagamenti').select('*');
                const { data: presenze } = await supabaseClient.from('presenze').select('*');

                tbody.innerHTML = '';
                const totaliMese = { iscrizione: 0 };
                mesiCorrenti.forEach(m => totaliMese[m.id] = 0);

                soci.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-700/20 transition";
                    let html = `
                        <td class="p-4 sticky left-0 bg-slate-800 z-10 border-r border-slate-700 text-left">
                            <p class="font-bold text-white text-[11px] leading-tight">${s.cognome} ${s.nome}</p>
                            <p class="text-[8px] text-slate-500 uppercase">${s.corso_scelto || 'N/D'}</p>
                        </td>
                    `;

                    const pIsc = pagamenti.find(p => p.socio_id === s.id && p.corso === 'Iscrizione Annuale' && p.stato === 'Approvato');
                    if (pIsc) totaliMese.iscrizione += (parseFloat(pIsc.importo) || 0);
                    html += `<td class="p-2 text-center border-l border-slate-800 cursor-pointer ${pIsc ? 'bg-cyan-600/20 text-cyan-400 font-bold' : 'bg-slate-900/30'}" onclick="openPayModal('${s.id}', '${s.nome} ${s.cognome}', 0, ${annoSelezionato}, 'Iscrizione Annuale')">${pIsc ? '€' + parseFloat(pIsc.importo).toFixed(0) : '<i class="fa-solid fa-plus opacity-10"></i>'}</td>`;

                    mesiCorrenti.forEach(m => {
                        const annoMese = (tipoAnno === 'solare') ? annoSelezionato : ((m.id >= 9) ? annoSelezionato : annoSelezionato + 1);
                        const p = pagamenti.find(pag => pag.socio_id === s.id && pag.mese_riferimento === m.id && pag.anno_riferimento === annoMese && pag.stato === 'Approvato');
                        if (p) totaliMese[m.id] += (parseFloat(p.importo) || 0);

                        const eraPres = presenze.some(pr => {
                            const d = new Date(pr.data_presenza);
                            return pr.socio_id === s.id && (d.getMonth()+1) === m.id && d.getFullYear() === annoMese;
                        });
                        const nonPrat = s.mesi_non_praticante && s.mesi_non_praticante.includes(`${m.id}-${annoMese}`);

                        let style = 'bg-slate-900/30';
                        let content = '<i class="fa-solid fa-plus opacity-5"></i>';
                        if (p) { style = 'bg-green-600/20 text-green-400 font-bold'; content = '€' + parseFloat(p.importo).toFixed(0); }
                        else if (eraPres && !nonPrat) { style = 'bg-red-600/20 text-red-500 animate-pulse'; content = '<i class="fa-solid fa-triangle-exclamation"></i>'; }
                        else if (nonPrat) { style = 'bg-slate-700/50 text-slate-500'; content = '<i class="fa-solid fa-user-slash text-[8px]"></i>'; }

                        html += `<td class="p-2 text-center border-l border-slate-800 cursor-pointer hover:bg-slate-700/50 transition-all ${style}" onclick="openPayModal('${s.id}', '${s.nome} ${s.cognome}', ${m.id}, ${annoMese}, 'Mensilità')">${content}</td>`;
                    });
                    tr.innerHTML = html;
                    tbody.appendChild(tr);
                });

                const trTot = document.createElement('tr');
                trTot.className = "bg-slate-900/90 font-black text-white border-t-2 border-slate-600";
                let totHtml = `<td class="p-4 sticky left-0 bg-slate-900 z-10 uppercase tracking-widest text-[9px] text-left">Totali Mensili</td><td class="p-2 text-center border-l border-slate-700 text-cyan-400 font-bold">€${totaliMese.iscrizione.toFixed(0)}</td>`;
                mesiCorrenti.forEach(m => totHtml += `<td class="p-2 text-center border-l border-slate-800">€${totaliMese[m.id].toFixed(0)}</td>`);
                trTot.innerHTML = totHtml;
                tbody.appendChild(trTot);

                renderKPI(pagamenti, soci);
            } catch (err) { console.error(err); }
        }

        function renderKPI(pagamenti, sociVis) {
            const container = document.getElementById('kpi-section');
            const ora = new Date();
            const sIds = sociVis.map(s => s.id);
            const pFilt = pagamenti.filter(p => p.stato === 'Approvato' && sIds.includes(p.socio_id));
            const totVis = pFilt.reduce((sum, p) => sum + (parseFloat(p.importo) || 0), 0);
            const totMese = pFilt.filter(p => (new Date(p.data_pagamento).getMonth()+1) === (ora.getMonth()+1)).reduce((sum, p) => sum + (parseFloat(p.importo) || 0), 0);

            container.innerHTML = `
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                    <p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest leading-tight">Entrate Mese Corrente</p>
                    <p class="text-2xl font-black text-emerald-400">€${totMese.toFixed(0)}</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                    <p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest leading-tight">Totale Soci Visualizzati</p>
                    <p class="text-2xl font-black text-white">€${totVis.toFixed(0)}</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg col-span-2">
                    <p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest leading-tight">Istruttore / Filtro</p>
                    <p class="text-xs font-bold text-cyan-400 uppercase tracking-widest truncate">${sessionUser.nome}</p>
                </div>
            `;
        }

        function openPayModal(id, nome, mese, anno, tipo) {
            currentSelection = { socioId: id, mese, anno, tipo };
            const label = (mese === 0) ? 'Iscrizione' : (mesiAccademici.find(m => m.id === mese) || mesiSolari.find(m => m.id === mese)).nome;
            document.getElementById('modal-title').textContent = `${label} ${anno} - ${nome}`;
            document.getElementById('modal-pagamento').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal-pagamento').classList.add('hidden'); }

        async function salvaPagamentoRapido() {
            const imp = document.getElementById('pay-amount').value;
            const met = document.getElementById('pay-method').value;
            if (!imp) return;
            try {
                const { error } = await supabaseClient.from('pagamenti').insert([{
                    socio_id: currentSelection.socioId,
                    importo: parseFloat(imp),
                    importo_totale: parseFloat(imp),
                    mese_riferimento: currentSelection.mese,
                    anno_riferimento: currentSelection.anno,
                    data_pagamento: new Date().toISOString().split('T')[0],
                    metodo: met,
                    stato: 'Approvato',
                    corso: currentSelection.tipo,
                    tipo_pagamento: currentSelection.tipo,
                    periodo_riferimento: currentSelection.mese === 0 ? 'Annuale' : `${currentSelection.mese}/${currentSelection.anno}`
                }]);
                if (error) throw error;
                closeModal(); caricaDatiContabili();
            } catch (err) { alert(err.message); }
        }

        async function toggleMorositaConvalidata() {
            const key = `${currentSelection.mese}-${currentSelection.anno}`;
            try {
                const { data: s } = await supabaseClient.from('soci').select('mesi_non_praticante').eq('id', currentSelection.socioId).single();
                let mesi = s.mesi_non_praticante || [];
                mesi = mesi.includes(key) ? mesi.filter(m => m !== key) : [...mesi, key];
                const { error } = await supabaseClient.from('soci').update({ mesi_non_praticante: mesi }).eq('id', currentSelection.socioId);
                if (error) throw error;
                closeModal(); caricaDatiContabili();
            } catch (err) { alert(err.message); }
        }

        caricaDatiContabili();
    </script>
</body>
</html>
